<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14111f">
<title>Topple</title>
<style>
:root{--bg:#14111f;--panel:rgba(24,20,40,.74);--line:rgba(255,255,255,.16);--tx:#f3efff;--mut:#a79fc4;--acc:#ffb347;--acc2:#ff5e8a;--ok:#6bf2b0;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:600 14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.hide{display:none!important}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
.btn{appearance:none;white-space:nowrap;border:1px solid var(--line);background:rgba(28,22,46,.78);color:var(--tx);height:44px;min-width:44px;padding:0 14px;border-radius:14px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}
.btn:active{transform:scale(.95);background:rgba(255,255,255,.16)}
.btn.sm{height:38px;min-width:38px;padding:0 10px;border-radius:12px}
.btn.acc{background:linear-gradient(135deg,#ffb347,#ff5e8a);border-color:transparent;color:#2a0f1c;font-weight:800}
.btn.on{background:rgba(120,78,24,.85);border-color:var(--acc);color:#ffe2b8}
.btn[disabled]{opacity:.4}
.muted{color:var(--mut)}

/* menu */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 40%,rgba(20,17,31,.25),rgba(20,17,31,.78))}
#menu h1{margin:0;font-size:clamp(48px,14vw,92px);letter-spacing:.06em;font-weight:900;background:linear-gradient(90deg,#ff5e8a,#ffb347,#6bf2b0,#58b8ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45))}
#menu .sub{margin:-8px 0 8px;color:var(--mut);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.mbtn{width:min(340px,86vw);height:64px;border-radius:20px;font-size:18px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;text-align:left}
.mbtn small{display:block;font-weight:600;color:var(--mut);font-size:12px}
.mbtn.acc small{color:rgba(42,15,28,.7)}
.mrow{display:flex;gap:10px;width:min(340px,86vw)}
.mrow .btn{flex:1}
#pts{color:var(--mut);font-size:12px;text-align:center;line-height:1.6}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;width:min(340px,86vw);margin:0 auto}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff5e8a,#ffb347)}

/* build hud */
#top{position:absolute;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#cnt{flex:0 1 auto;margin:0 auto;text-align:center;pointer-events:none;font-weight:800;font-size:15px;padding:4px 14px;border-radius:14px;background:rgba(20,16,36,.72);border:1px solid rgba(255,255,255,.12);max-width:calc(100vw - 230px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#cnt small{display:block;font-weight:600;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#bottom{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
#bottom>*{pointer-events:auto}
#opts{width:100%;max-width:760px;padding:8px 10px;min-height:76px;display:flex;align-items:center;gap:10px}
#tools{width:100%;max-width:760px;display:flex;gap:8px;align-items:center;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#tools .tl{flex:1;height:56px;flex-direction:column;gap:0;font-size:11px;padding:0 4px;line-height:1.1}
#tools .tl b{font-size:20px;line-height:1.1}
#bPlay{flex:1.6;height:56px;font-size:20px;letter-spacing:.04em}
#tray{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:2px}
#tray::-webkit-scrollbar{display:none}
.tile{position:relative;flex:none;width:62px;height:62px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;font-size:11px;gap:2px}
.tile svg{width:34px;height:28px}
.tile.sel{border-color:var(--acc);background:rgba(255,179,71,.18)}
.tile.lock{opacity:.45}
.tile .bd{position:absolute;right:3px;top:2px;font-size:10px;color:var(--acc)}
.tile .lk{position:absolute;inset:auto 0 3px 0;text-align:center;font-size:9px;color:var(--mut)}
#opts input[type=range]{flex:1;accent-color:var(--acc);height:34px}
#opts .lbl{font-size:12px;color:var(--mut);white-space:nowrap}
#hint{flex:1;color:var(--mut);font-size:13px;line-height:1.3}
.sq{width:42px;height:42px;padding:0;flex:none}

/* play hud */
#hudPlay{position:absolute;inset:0;pointer-events:none}
#hudPlay>*{pointer-events:auto}
#pTop{position:absolute;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
#pTop>*{pointer-events:auto}
#sc{text-align:center;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.7);background:rgba(20,16,36,.5);border-radius:18px;padding:4px 16px 6px;min-width:120px}
#score{font-size:clamp(34px,9vw,52px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
#chain{margin-top:4px;font-weight:800;color:var(--acc);font-size:16px;height:22px;transition:transform .1s}
#chain.bump{transform:scale(1.25)}
#pBot{position:absolute;right:8px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px}
#pBot.hide{display:none}

/* results */
#res{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(440px,calc(100vw - 16px));padding:16px;text-align:center}
#res h2{margin:0;font-size:20px;letter-spacing:.04em}
#res .big{font-size:46px;font-weight:900;line-height:1.1;margin:4px 0;font-variant-numeric:tabular-nums}
#res .rows{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;margin:8px 4px 12px;font-size:14px}
#res .rows span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
#res .ok{color:var(--ok)}#res .bad{color:var(--bad)}
#res .acts{display:flex;gap:8px}#res .acts .btn{flex:1}
#unlockNote{color:var(--acc);font-weight:800;margin:0 0 10px}

/* modal */
.modal{position:absolute;inset:0;background:rgba(10,8,20,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{width:min(560px,100%);max-height:100%;overflow:auto;padding:18px}
.modal h3{margin:0 0 4px;font-size:20px}
.modal h4{margin:16px 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;background:rgba(255,255,255,.05);font-size:12px;position:relative;cursor:pointer;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.item.sel{border-color:var(--acc);background:rgba(255,179,71,.16)}
.item.lock{opacity:.45;cursor:default}
.item .sw{height:14px;width:70%;border-radius:7px}
.item small{color:var(--mut);font-size:11px}
.modal ul{margin:6px 0 12px;padding-left:20px;color:#d9d3ef;line-height:1.55}
.modal .row{display:flex;gap:8px;margin-top:14px}.modal .row .btn{flex:1}

#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-10px);padding:10px 18px;border-radius:999px;background:rgba(20,17,31,.92);border:1px solid var(--line);font-weight:800;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.pop{position:absolute;pointer-events:none;font-weight:900;font-size:22px;color:#ffe08a;text-shadow:0 2px 8px rgba(0,0,0,.8);animation:pop 1.2s ease-out forwards;transform:translate(-50%,-50%)}
.pop.big{font-size:30px;color:var(--ok)}
@keyframes pop{0%{opacity:0;margin-top:0;scale:.6}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-70px;scale:1}}

/* levels */
#levels{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,#2a1f48,#120e1f 70%);display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 10px 0}
#lvTop{display:flex;align-items:center;gap:10px;padding:0 4px 10px;max-width:820px;width:100%;margin:0 auto}
#lvTitle{flex:1;font-size:22px;font-weight:900;letter-spacing:.04em}
#lvStars{color:#ffd34d;font-weight:800}
#lvList{flex:1;overflow-y:auto;padding:0 4px max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start;max-width:820px;width:100%;margin:0 auto;touch-action:pan-y}
.world{border-radius:20px;padding:14px;position:relative;border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.world h3{margin:0;font-size:19px;display:flex;align-items:center;gap:8px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.world h3 .ic{font-size:26px}
.world p{margin:2px 0 10px;font-size:12px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.world.lock{filter:grayscale(.8) brightness(.6)}
.lvs{display:flex;gap:8px}
.lv{flex:1 1 0;min-width:0;height:62px;max-width:72px;border-radius:14px;background:rgba(10,6,20,.55);border:1px solid rgba(255,255,255,.22);color:#fff;font:inherit;font-weight:900;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;touch-action:manipulation}
.lv small{font-size:10px;letter-spacing:-1px}.lv small b{color:#ffd34d;font-weight:900}.lv small i{font-style:normal;color:rgba(255,255,255,.25)}
.lv.lock{opacity:.45}
.lv:active{transform:scale(.94)}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(ellipse at center,transparent 45%,rgba(40,120,255,.35) 100%)}
#vig.on{opacity:1}
#tip{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 54px);width:min(460px,calc(100vw - 24px));padding:10px 14px;border-radius:16px;background:rgba(20,16,36,.9);border:1px solid var(--acc);font-size:14px;line-height:1.35;text-align:center;pointer-events:auto}
#obj{display:block;font-size:11px;color:#ffe2b8;font-weight:700;margin-top:1px}
#objP{font-size:13px;font-weight:800;color:#fff;margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.stars{font-size:40px;letter-spacing:6px;margin:4px 0 2px}
.stars i{font-style:normal;color:#4a4060;display:inline-block}
.stars i.on{color:#ffd34d;animation:starpop .5s cubic-bezier(.2,1.6,.4,1) backwards;text-shadow:0 0 14px rgba(255,211,77,.7)}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
.chk{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;text-align:left;margin:6px 8px 10px;font-size:14px}
.chk .y{color:var(--ok)}.chk .n{color:#776c95}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .5s}
#ver{color:rgba(255,255,255,.4);font-size:11px;letter-spacing:.08em;margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="menu">
    <h1>TOPPLE</h1>
    <div class="sub">tip the first one</div>
    <button class="btn acc mbtn" id="bLevels"><span>Levels<small id="lvSub">7 worlds · 35 levels</small></span><span>▶</span></button>
    <button class="btn mbtn" id="bFree"><span>Freestyle<small>Build anything. Chase the chain.</small></span><span>✎</span></button>
    <button class="btn mbtn" id="bDaily"><span>Daily Build<small id="dailySub">Same course for everyone</small></span><span>★</span></button>
    <div class="mrow"><button class="btn" id="bUnlock">Unlocks</button><button class="btn" id="bHelp">How to play</button></div>
    <div id="pts"></div>
    <div class="bar"><i id="ptsBar"></i></div>
    <div id="ver">Topple v0.2.1</div>
  </div>

  <div id="hudBuild" class="hide">
    <div id="top">
      <button class="btn sm" id="bHome" aria-label="Menu">⌂</button>
      <div id="cnt"></div>
      <button class="btn sm" id="bUndo" aria-label="Undo">↶</button>
      <button class="btn sm" id="bClear" aria-label="Clear">🗑</button>
      <button class="btn sm" id="bSnd" aria-label="Sound">♪</button>
    </div>
    <div id="bottom">
      <div id="opts" class="panel"></div>
      <div id="tools">
        <button class="btn tl on" data-tool="draw"><b>✎</b>Draw</button>
        <button class="btn tl" data-tool="stamp"><b>▦</b>Stamp</button>
        <button class="btn tl" data-tool="erase"><b>⌫</b>Erase</button>
        <button class="btn tl" data-tool="start"><b>⚑</b>Start</button>
        <button class="btn acc" id="bPlay">▶ PLAY</button>
      </div>
    </div>
  </div>

  <div id="hudPlay" class="hide">
    <div id="pTop">
      <button class="btn sm" id="bStop">✕ Stop</button>
      <div id="sc"><div id="score">0</div><div id="chain"></div><div id="objP"></div></div>
      <div style="width:76px"></div>
    </div>
    <div id="pBot">
      <button class="btn sm" id="bSlow">1×</button>
      <button class="btn sm" id="bCam">Chase</button>
    </div>
    <div id="res" class="panel hide"></div>
  </div>

  <div id="levels" class="hide">
    <div id="lvTop"><button class="btn sm" id="lvBack">⌂</button><div id="lvTitle">Levels</div><div id="lvStars"></div></div>
    <div id="lvList"></div>
  </div>
  <div id="vig"></div><div id="flash"></div>
  <div id="tip" class="hide"></div>
  <div id="modal" class="modal hide"><div class="card panel" id="modalCard"></div></div>
  <div id="toast"></div>
</div>
<script src="lib/three.min.js"></script>
<script src="lib/rapier.js"></script>
<script src="game.js?v=0.2.1"></script>
</body>
</html>
