<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chain Reaction Lab</title>
<style>
:root{--bg:#0a1024;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--tx:#e8eeff;--mut:#93a0c8;--acc:#5ee0c1;--warn:#ff7fa8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:500 14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:absolute;inset:0;display:block;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px}
.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--tx);height:40px;min-width:40px;padding:0 12px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}
.btn:active{transform:scale(.96);background:rgba(255,255,255,.14)}
.btn.acc{background:linear-gradient(135deg,#5ee0c1,#4aa8ff);border-color:transparent;color:#06222a;min-width:104px;font-weight:700}
.btn.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,127,168,.25)}}
#top{position:absolute;left:6px;right:6px;top:max(6px,env(safe-area-inset-top));height:44px;display:flex;align-items:center;gap:8px;padding:0 6px}
#title{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
#lvNum{color:var(--acc);font-weight:700}
#lvName{font-weight:600;overflow:hidden;text-overflow:ellipsis}
#partsInfo{color:var(--mut);font-size:12px;white-space:nowrap}
#top .btn{height:34px;min-width:34px;padding:0 8px}
#bottom{position:absolute;left:6px;right:6px;bottom:max(6px,env(safe-area-inset-bottom));height:72px;display:flex;align-items:center;gap:10px;padding:6px 10px;transition:background .2s,border-color .2s}
#bottom.del{background:rgba(255,127,168,.18);border-color:rgba(255,127,168,.6)}
#tray{flex:1;display:flex;gap:8px;align-items:center;overflow-x:auto;min-width:0;scrollbar-width:none}
#tray::-webkit-scrollbar{display:none}
#trayHint{color:var(--mut);font-size:12px;padding:0 6px}
.tile{position:relative;flex:none;width:58px;height:58px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none;cursor:grab}
.tile svg{width:34px;height:34px}
.tile span.lb{font-size:9.5px;color:var(--mut);letter-spacing:.2px}
.tile .bd{position:absolute;right:-5px;top:-6px;min-width:19px;height:19px;border-radius:10px;background:#1a2550;border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.tile.empty{opacity:.28;pointer-events:none}
#controls{display:flex;gap:8px;align-items:center}
#bcontrols{display:none;gap:8px;align-items:center}
#bottom.build #controls{display:none}
#bottom.build #bcontrols{display:flex}
.tile.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(94,224,193,.25);background:rgba(94,224,193,.1)}
textarea.code{width:100%;height:110px;resize:none;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:#d6f7ee;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:10px;word-break:break-all;user-select:text;-webkit-user-select:text}
.prow{display:flex;align-items:center;justify-content:space-between;padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.prow .pm{height:32px;min-width:32px;padding:0}
.prow .pc{display:inline-block;min-width:28px;text-align:center}
.nm-in{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;padding:6px 10px;width:60%;user-select:text;-webkit-user-select:text}
#sel{position:absolute;display:none;gap:6px;padding:6px;z-index:5}
#sel .btn{width:40px;padding:0}
#toast{position:absolute;left:50%;top:calc(max(6px,env(safe-area-inset-top)) + 56px);transform:translate(-50%,-8px);padding:8px 14px;border-radius:12px;background:rgba(18,26,58,.92);border:1px solid var(--line);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tip{position:absolute;left:50%;top:calc(max(6px,env(safe-area-inset-top)) + 56px);transform:translateX(-50%);max-width:min(520px,88vw);padding:7px 12px;text-align:center;color:#cfe;font-size:12.5px;opacity:0;transition:opacity .4s;pointer-events:none}
#tip.show{opacity:1}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,20,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:10;padding:12px}
#modal.show{display:flex}
.card{width:min(440px,100%);max-height:100%;overflow:auto;padding:20px;background:rgba(20,28,64,.92);border:1px solid var(--line);border-radius:22px;text-align:center;touch-action:pan-y}
.card h2{margin:0 0 4px;font-size:22px}
.stars{font-size:34px;letter-spacing:6px;margin:6px 0 10px;color:#ffd98a;text-shadow:0 0 16px rgba(255,200,100,.5)}
.stars i{font-style:normal;opacity:.22}
.stars i.on{opacity:1}
.lab{margin:10px 0 16px;padding:12px 14px;border-radius:14px;background:rgba(94,224,193,.08);border:1px solid rgba(94,224,193,.25);text-align:left;font-size:13.5px;color:#d6f7ee}
.lab b{color:var(--acc);display:block;font-size:11px;letter-spacing:1px;margin-bottom:3px}
.row{display:flex;gap:10px;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.lv{padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font:inherit;cursor:pointer;touch-action:manipulation}
.lv.cur{border-color:var(--acc);box-shadow:0 0 0 2px rgba(94,224,193,.2)}
.lv .n{font-size:20px;font-weight:700;color:var(--acc)}
.lv .nm{font-size:11px;color:var(--mut);margin:2px 0}
.lv .st{font-size:13px;color:#ffd98a;letter-spacing:2px}
@media (max-height:460px){#tip{top:auto;bottom:calc(max(6px,env(safe-area-inset-bottom)) + 84px);max-width:60vw;font-size:12px}}
@media (orientation:portrait){
  #bottom{flex-wrap:wrap;height:auto;padding:8px 10px;gap:8px}
  #tray{flex:1 1 100%;order:1;justify-content:safe center}
  #controls{flex:1 1 100%;order:2}
  #btnRun{flex:1}
  .tile{width:68px;height:68px}
  .tile svg{width:38px;height:38px}
  #sel .btn{width:44px;height:44px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="top" class="panel">
    <button class="btn" id="btnLevels" aria-label="Levels">&#9776;</button>
    <div id="title"><span id="lvNum">1</span><span id="lvName"></span></div>
    <div id="partsInfo"></div>
    <button class="btn" id="btnZoom" aria-label="Zoom">&#10530;</button>
    <button class="btn" id="btnHint" aria-label="Hint">&#128161;</button>
    <button class="btn" id="btnSound" aria-label="Sound">&#128266;</button>
  </div>
  <div id="tip" class="panel"></div>
  <div id="toast"></div>
  <div id="sel" class="panel">
    <button class="btn" id="selL" aria-label="Rotate left">&#10226;</button>
    <button class="btn" id="selR" aria-label="Rotate right">&#10227;</button>
    <button class="btn" id="selM" aria-label="Mirror">&#8644;</button>
    <button class="btn" id="selD" aria-label="Remove">&#128465;</button>
  </div>
  <div id="bottom" class="panel">
    <div id="tray"></div>
    <div id="controls">
      <button class="btn" id="btnReset" aria-label="Reset">&#8634;</button>
      <button class="btn" id="btnSpeed">1&times;</button>
      <button class="btn acc" id="btnRun">&#9654; Run</button>
    </div>
    <div id="bcontrols">
      <button class="btn" id="bParts">Parts</button>
      <button class="btn" id="bGoal" aria-label="Rotate goal">&#10227; Goal</button>
      <button class="btn" id="bClear" aria-label="Clear">&#128465;</button>
      <button class="btn" id="bShare">Share</button>
      <button class="btn acc" id="bTest">&#9654; Test</button>
    </div>
  </div>
  <div id="modal"><div class="card" id="card"></div></div>
</div>

<script>/* Chain Reaction Lab — physics engine (no DOM) */
(function (root) {
  var M = root.Matter || require('matter-js');
  var W = 960, H = 540, BR = 13;
  var DEG = Math.PI / 180;
  var LIM_MIN = 14 * DEG, LIM_MAX = 40 * DEG;
  var TUNE = { e: 1.0, minOut: 7, mag: 0.0075, fan: 0.0042, belt: 2.7, gearTol: 10 };
  var CH_COL = { 1: '#ffd166', 2: '#f08bff', 3: '#6ee7ff' };

  var DEFS = {
    ramp:    { label: 'Ramp',   len: 150, th: 12, rot: true,  mir: true,  tip: 'Ramp: turns height into speed.' },
    bumper:  { label: 'Bumper', r: 22,            rot: false, mir: false, tip: 'Bumper: a bouncy post that pings the ball away.' },
    lever:   { label: 'Lever',  len: 210, th: 12, rot: false, mir: true,  fulcrum: true, tip: 'Lever: snaps onto a fulcrum and tips like a seesaw.' },
    spring:  { label: 'Spring', w: 84, th: 12,    rot: true,  mir: true,  tip: 'Spring pad: stores energy, then launches.' },
    magnet:  { label: 'Magnet', r: 18, R: 170,    rot: false, mir: false, power: true, tip: 'Electromagnet: pulls the steel ball. Tap it while running to switch it on or off.' },
    conveyor:{ label: 'Belt',   len: 130, th: 14, rot: true,  mir: true,  power: true, tip: 'Conveyor: a motor-driven belt carries the ball. Mirror flips its direction.' },
    pipe:    { label: 'Pipe',   len: 170, th: 16, rot: true,  mir: false, tip: 'Pipe: the ball enters one end and comes out the other, whatever is in between.' },
    domino:  { label: 'Domino', w: 8, th: 46,      rot: false, mir: false, tip: 'Domino: stand them in a row. Each one that falls pushes the next.' },
    pendulum:{ label: 'Pendulum', len: 20, th: 20, L: 120, rot: true, mir: false, tip: 'Pendulum: a heavy bob swings from the pivot. The rotate ring sets how far back it starts.' },
    cannon:  { label: 'Cannon', r: 22,             rot: true,  mir: false, tip: 'Cannon: the ball is loaded, held a moment, then fired along the barrel.' },
    fan:     { label: 'Fan',    w: 64, th: 16,    rot: true,  mir: false, power: true, tip: 'Fan: moving air pushes the ball along the way it points.' },
    gearS:   { label: 'Gear S', r: 24,            rot: false, mir: false, gear: true, tip: 'Small gear: meshing gears spin opposite ways. Small drives big slower, big drives small faster.' },
    gearL:   { label: 'Gear L', r: 42,            rot: false, mir: false, gear: true, tip: 'Large gear: turns slower but with more torque when driven by a small gear.' }
  };
  var ORDER = ['ramp', 'bumper', 'lever', 'spring', 'pipe', 'domino', 'pendulum', 'cannon', 'magnet', 'conveyor', 'fan', 'gearS', 'gearL'];

  /* ---------- level helpers ---------- */
  function shelf(x0, x1, top, thick, hole) {
    if (!hole) return [{ x: (x0 + x1) / 2, y: top + thick / 2, w: x1 - x0, h: thick, a: 0 }];
    var l = hole.x - hole.w / 2, r = hole.x + hole.w / 2;
    return [
      { x: (x0 + l) / 2, y: top + thick / 2, w: l - x0, h: thick, a: 0 },
      { x: (r + x1) / 2, y: top + thick / 2, w: x1 - r, h: thick, a: 0 },
      { x: hole.x, y: top + (hole.d + thick) / 2, w: hole.w, h: thick - hole.d, a: 0 }
    ];
  }
  function box(x0, y0, x1, y1) { return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0, a: 0 }; }

  function goalFrame(g) { var a = (g.ang || 0) * DEG; return { a: a, ux: Math.cos(a), uy: Math.sin(a), vx: -Math.sin(a), vy: Math.cos(a) }; }
  function goalLocal(g, x, y) { var f = goalFrame(g), dx = x - g.x, dy = y - g.y; return { u: dx * f.ux + dy * f.uy, v: dx * f.vx + dy * f.vy }; }
  function cupStatics(g) {
    var t = 12, f = goalFrame(g), out = [];
    function R(u, v, w, h) { return { x: g.x + u * f.ux + v * f.vx, y: g.y + u * f.uy + v * f.vy, w: w, h: h, a: f.a }; }
    out.push(R(-(g.w / 2 + t / 2), g.d / 2, t, g.d + t));
    out.push(R(g.w / 2 + t / 2, g.d / 2, t, g.d + t));
    out.push(R(0, g.d + t / 2, g.w + 2 * t, t));
    return out;
  }
  function allStatics(level) { return level.goal && level.goal.cup ? level.statics.concat(cupStatics(level.goal)) : level.statics; }

  /* fixtures + player parts, merged */
  function fixturesOf(level) {
    return (level.fixtures || []).map(function (f, i) { var o = {}; for (var k in f) o[k] = f[k]; o.id = 'f' + i; o.fixed = true; o.a = (f.a || 0) * DEG; return o; });
  }

  /* ---------- gear graph ---------- */
  function gearNodes(level, placed) {
    var nodes = [];
    fixturesOf(level).forEach(function (f) {
      if (f.type === 'motorgear') nodes.push({ id: f.id, x: f.x, y: f.y, r: f.r, motor: true, w0: f.w || 3, fixed: true });
      else if (f.type === 'gearfix') nodes.push({ id: f.id, x: f.x, y: f.y, r: f.r, fixed: true });
      else if (f.type === 'rotor') nodes.push({ id: f.id, x: f.x, y: f.y, r: f.r, rotor: true, fixed: true });
    });
    placed.forEach(function (p) { var d = DEFS[p.type]; if (d && d.gear) nodes.push({ id: p.id, x: p.x, y: p.y, r: d.r }); });
    var q = [];
    nodes.forEach(function (n) { n.w = 0; n.on = false; if (n.motor) { n.w = n.w0; n.on = true; q.push(n); } });
    while (q.length) {
      var a = q.shift();
      nodes.forEach(function (b) {
        if (b.on) return;
        var d = Math.hypot(a.x - b.x, a.y - b.y);
        if (Math.abs(d - (a.r + b.r)) <= TUNE.gearTol) { b.on = true; b.w = -a.w * a.r / b.r; q.push(b); }

    return nodes;
  }

  /* ---------- simulation ---------- */
  function createSim(level, placed) {
    var Bodies = M.Bodies, Body = M.Body, C = M.Constraint, Comp = M.Composite;
    var engine = M.Engine.create();
    engine.gravity.y = 1; engine.gravity.scale = 0.0012;
    engine.positionIterations = 10; engine.velocityIterations = 8;
    var world = engine.world;
    var sim = {
      springs: [], engine: engine, t: 0, inGoal: 0, won: false, stall: 0, levers: [], gates: [], weights: [], parts: {}, ball: null,
      cannons: [], cannonState: null, cannonCool: 0, balloons: [], pend: [], dyn: [], chain: 0, chainSet: {}, pops: [],
      tubes: [], hazards: [], tubeState: null, tubeCool: 0, destroyed: null,
      trail: [], tick: 0, failed: false, magnets: [], belts: [], fans: [], buttons: [], rotors: [], power: { 1: false, 2: false, 3: false },
      manual: {}, hit: null, hitId: 0, gears: null
    };
    function add(b) { Comp.add(world, b); return b; }

    add(Bodies.rectangle(-25, H / 2, 50, 4000, { isStatic: true }));
    add(Bodies.rectangle(W + 25, H / 2, 50, 4000, { isStatic: true }));
    add(Bodies.rectangle(W / 2, -600, 4000, 50, { isStatic: true }));
    add(Bodies.rectangle(W / 2, H + 400, 4000, 50, { isStatic: true }));

    allStatics(level).forEach(function (s) {
      add(Bodies.rectangle(s.x, s.y, s.w, s.h, { isStatic: true, angle: (s.a || 0), friction: 0, restitution: 0.15 }));
    });
    (level.gates || []).forEach(function (g) {
      var b = add(Bodies.rectangle(g.x, g.y, g.w, g.h, { isStatic: true, friction: 0.02 }));
      sim.gates.push({ body: b, g: g, off: 0 });
    });
    (level.weights || []).forEach(function (w) {
      var b = add(Bodies.rectangle(w.x, w.y, w.w, w.h, { density: w.density, friction: 0.3, restitution: 0.05, frictionAir: 0.001, chamfer: { radius: 4 } }));
      sim.weights.push(b);
    });

    var fixes = fixturesOf(level);
    var all = fixes.concat(placed);
    var gearInfo = gearNodes(level, placed);
    sim.gears = gearInfo;

    all.forEach(function (p) {
      var d = DEFS[p.type], b = null, m = p.m || 1;
      if (p.type === 'ramp') {
        b = add(Bodies.rectangle(p.x, p.y, d.len, d.th, { isStatic: true, angle: p.a, friction: 0, restitution: 0.1, chamfer: { radius: 5 } }));
      } else if (p.type === 'bumper') {
        b = add(Bodies.circle(p.x, p.y, d.r, { isStatic: true, friction: 0 }));
        b.restitution = 1.15; b.__bump = p.id;
      } else if (p.type === 'lever') {
        var f = p.fulcrum;
        var plank = Bodies.rectangle(f.x, f.y, d.len, d.th, { density: 0.002, chamfer: { radius: 5 } });
        var lip = Bodies.rectangle(f.x - 68 * m, f.y - 12, 8, 24, { density: 0.002, chamfer: { radius: 3 } });
        b = Body.create({ parts: [plank, lip], friction: 0.2, restitution: 0, frictionAir: 0.02 });
        var off = { x: f.x - b.position.x, y: f.y - b.position.y };
        add(b);
        add(C.create({ pointA: { x: f.x, y: f.y }, bodyB: b, pointB: off, length: 0, stiffness: 1 }));
        Body.rotate(b, LIM_MIN * m, { x: f.x, y: f.y });
        b.__pivot = { x: f.x, y: f.y };
        b.__lo = m > 0 ? LIM_MIN : -LIM_MAX; b.__hi = m > 0 ? LIM_MAX : -LIM_MIN;
        sim.levers.push(b);
      } else if (p.type === 'spring') {
        b = add(Bodies.rectangle(p.x, p.y, d.w, d.th, { isStatic: true, angle: p.a, friction: 0, chamfer: { radius: 4 } }));
        b.__spring = true; b.__n = { x: Math.sin(p.a), y: -Math.cos(p.a) }; b.__hit = -1e9;
        sim.springs.push(b);
      } else if (p.type === 'magnet') {
        b = add(Bodies.circle(p.x, p.y, d.r, { isStatic: true, friction: 0 }));
        b.restitution = 0.2;
        sim.manual[p.id] = p.on !== false;
        sim.magnets.push({ id: p.id, x: p.x, y: p.y, ch: p.ch || 0 });
      } else if (p.type === 'conveyor') {
        b = add(Bodies.rectangle(p.x - Math.sin(p.a) * 8, p.y + Math.cos(p.a) * 8, d.len, d.th + 16, { isStatic: true, angle: p.a, friction: 0, chamfer: { radius: 4 } }));
        b.__belt = true; b.__dir = { x: Math.cos(p.a) * m, y: Math.sin(p.a) * m }; b.__ch = p.ch || 0; b.__gear = p.gear || null;
        sim.belts.push(b);

    var b = S.build, l = b.lv;
    if (!Object.keys(l.tray).length) { toast('Give the player at least one part'); showPartsEditor(); return; }
    var bad = l.statics.some(function (s) { return Math.abs(l.ball.x - s.x) < s.w / 2 + 14 && Math.abs(l.ball.y - s.y) < s.h / 2 + 14; });
    if (bad) { toast('The ball is inside a block'); return; }
    b.testing = true; b.verified = false; resetState(); $('bottom').classList.remove('build'); renderTray(); updateHud();
    showTip('Solve your own level to prove it can be done. Then you can share it.');
    $('btnLevels').innerHTML = '&#9664;';
  }
  function builderBack() {
    var b = S.build; b.testing = false; resetState(); renderBuildTray(); updateHud(); $('btnLevels').innerHTML = '&#9776;'; closeModal();
  }
  function builderWon() {
    var b = S.build; b.verified = true;
    b.sol = S.placed.map(function (p) {
      var it = { type: p.type, x: p.x, y: p.y, a: Math.round(p.a / DEG) };
      if (p.m === -1) it.m = -1;
      var tg = (S.togLog || []).filter(function (q) { return q.id === p.id; }).map(function (q) { return q.n; });
      if (tg.length) it.tog = tg;
      return it;
    });
  }
  function showBuildWin() {
    var b = S.build, code = encodeLevel(b.lv, b.sol);
    $('card').innerHTML = '<h2>Verified!</h2><div style="color:var(--mut);font-size:13px;margin-bottom:8px">Your level can be solved. Share this code:</div>' +
      '<textarea class="code" id="codeOut" readonly>' + code + '</textarea>' +
      '<div class="row" style="margin-top:12px"><button class="btn" id="mEdit">Edit</button><button class="btn" id="mSave">Save</button><button class="btn acc" id="mCopy">Copy</button></div>';
    $('modal').classList.add('show');
    $('mEdit').addEventListener('click', builderBack);
    $('mCopy').addEventListener('click', function () {
      var ta = $('codeOut'); ta.select();
      try { navigator.clipboard.writeText(code).then(function () { toast('Copied'); }, function () { document.execCommand('copy'); toast('Copied'); }); } catch (e) { try { document.execCommand('copy'); toast('Copied'); } catch (e2) {} }
    });
    $('mSave').addEventListener('click', function () {
      var a = loadMine(); if (!a.some(function (m) { return m.code === code; })) { a.unshift({ name: b.lv.name, code: code }); saveMine(a); }
      toast('Saved to My levels');
    });
  }
  function builderShare() {
    var b = S.build;
    if (!b.verified) { toast('Test and solve your level first'); return; }
    showBuildWin();
  }
  function exitBuilder() { S.build = null; S.custom = null; $('btnLevels').innerHTML = '&#9776;'; loadLevel(0); showLevels(); }
  $('bParts').addEventListener('click', function () { if (S.build) showPartsEditor(); });
  $('bGoal').addEventListener('click', function () { if (S.build) rotateGoal(); });
  $('bTest').addEventListener('click', function () { if (S.build) builderTest(); });
  $('bShare').addEventListener('click', function () { if (S.build) builderShare(); });
  $('bClear').addEventListener('click', function () { if (S.build) { S.build.lv = newDraft(); S.custom = S.build.lv; S.build.verified = false; toast('Cleared'); } });

  resize(); loadLevel(0);
  requestAnimationFrame(frame);
  window.__crl = { S: S, cam: cam, loadLevel: loadLevel, doRun: doRun, doReset: doReset, renderTray: renderTray, updateHud: updateHud, gizmo: gizmo, toScreen: toScreen, toWorld: toWorld };
})();
</script>
</body>
</html>
