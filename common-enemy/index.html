<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050914">
<title>Common Enemy</title>
<style>
html,body{margin:0;height:100%;background:#050914;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;touch-action:none;outline:none}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0}
</style></head><body><canvas id="c" tabindex="0"></canvas><div id="probe"></div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),probe=document.getElementById('probe');
const W=360,PH=10,FONT="ui-monospace,'SF Mono',Menlo,Consolas,monospace";
const C0='#3a8bff',C1='#ff3347',YEL='#ffe34d',GRN='#7dff6b',ORG='#ffa53c',HAZ='#c77dff';
let H=640,S=1,OX=0,OY=0,DPR=1,MID=320,T=0,IW=360,IH=640;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
function mk(i){return{i,x:W/2,tx:W/2,y:0,w:64,lives:3,alive:true,score:0,inv:0,hit:0,col:i?C1:C0,aim:W/2,aiT:0,err:40,sp:220,fcd:0,rapid:0,wide:0,spread:0}}
function resetP(p){p.rapid=p.wide=p.spread=p.fcd=0;p.w=64}
const P=[mk(0),mk(1)];
const ball={x:W/2,y:320,vx:0,vy:0,r:6,sp:270,last:-1,tr:[]};
let state='title',mode=1,level=1,wave=0,attract=true,pts=[0,0],blocks=[],aliens=[],bolts=[],parts=[],pops=[],boss=null,shots=[],crates=[],fbtn=[];
let crateT=6,serveT=0,rally=0,bestRally=0,revives=0,shake=0,msg=null,dlg=null,btns=[],sound=true,revT=0;
let spawned=0,spawnT=0,waveState='spawn',clearT=0,sideFlip=1,snap=null,firstDown=true,best=0,overLine='',winRank='';
try{best=+localStorage.getItem('ce_best')||0}catch(e){}
const TOUCH=typeof navigator!=='undefined'&&navigator.maxTouchPoints>0;
const keys={},ctl=new Map(),fireHold=new Map();

/* ---------- layout ---------- */
function layout(){
  IW=innerWidth;IH=innerHeight;DPR=Math.min(devicePixelRatio||1,3);
  cv.width=Math.round(IW*DPR);cv.height=Math.round(IH*DPR);
  H=Math.max(600,Math.min(780,IH/IW*W));
  S=Math.min(IW/W,IH/H);OX=(IW-W*S)/2;OY=(IH-H*S)/2;
  const cs=getComputedStyle(probe);
  const sT=Math.max(0,((parseFloat(cs.paddingTop)||0)-OY)/S),sB=Math.max(0,((parseFloat(cs.paddingBottom)||0)-OY)/S);
  P[0].y=H-sB-86;P[1].y=sT+86;MID=H/2;
}

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,sl,delay){if(!sound)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const sfx={
  paddle:()=>tone(520,.06,'square',.05),wall:()=>tone(260,.05,'triangle',.05),brick:()=>tone(700,.09,'triangle',.06,300),
  kill:()=>{tone(320,.16,'sawtooth',.05,-220);tone(900,.05,'square',.03)},miss:()=>tone(320,.4,'sawtooth',.06,-260),
  hurt:()=>{tone(150,.3,'sawtooth',.07,-90);tone(90,.3,'square',.05)},
  revive:()=>[392,523,659,784].forEach((f,i)=>tone(f,.12,'square',.05,0,i*.08)),
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.14,'square',.05,0,i*.09)),
  wave:()=>{tone(220,.2,'sawtooth',.05,220);tone(330,.2,'sawtooth',.04,220,.12)},
  blip:()=>tone(900,.03,'square',.03),
  shoot:()=>tone(900,.07,'square',.025,-500),zap:()=>tone(220,.12,'sawtooth',.05,-140),power:()=>[523,784,1047].forEach((f,i)=>tone(f,.08,'square',.05,0,i*.06))
};
const BASS=[55,55,82.4,55,65.4,65.4,98,73.4],ARP=[440,523,659,523,392,494,587,494];
/* AUDIO LAYER: synth fallback now. Drop files in audio/voice/<key>.mp3 and audio/music/<track>.mp3
   (tracks: title, pong, invasion, boss, over, win) and they play automatically. */
const AUDIO_BASE='audio/';let curTrack=null,musEl=null,musOK={},vcache={},curVoice=null,unl=false;
function music(tr){
  if(tr===curTrack)return;curTrack=tr;
  if(musEl){musEl.pause();musEl=null}
  if(!sound||musOK[tr]===false)return;
  try{const a=new Audio(AUDIO_BASE+'music/'+tr+'.mp3');a.loop=true;a.volume=.55;
    a.addEventListener('error',()=>{musOK[tr]=false;if(musEl===a)musEl=null});
    a.addEventListener('playing',()=>{musOK[tr]=true});
    musEl=a;a.play().catch(()=>{})}catch(e){}
}
const synthOn=()=>!(musEl&&musOK[curTrack]===true);
function wantTrack(){return state==='title'?'title':state==='over'?'over':state==='win'?'win':boss?'boss':level>=4?'invasion':'pong'}
function syncMusic(){if(unl)music(wantTrack())}
function voice(key){
  if(!sound||!key||!unl||vcache[key]===false)return;
  try{let a=vcache[key];
    if(!a){a=new Audio(AUDIO_BASE+'voice/'+key+'.mp3');a.addEventListener('error',()=>{vcache[key]=false});vcache[key]=a}
    if(curVoice&&curVoice!==a)curVoice.pause();curVoice=a;a.currentTime=0;
    if(musEl)musEl.volume=.2;a.onended=()=>{if(musEl)musEl.volume=.55};a.play().catch(()=>{})}catch(e){}
}
let mstep=0;
setInterval(()=>{if(!sound||!AC||state!=='play'||!synthOn())return;mstep++;tone(BASS[mstep%8]*2,.13,'sawtooth',.028);if(level>=4&&mstep%2===0)tone(ARP[(mstep>>1)%8],.09,'square',.014)},150);

/* ---------- story ---------- */
const SP={BEEP:['ANCHOR BEEP',YEL],BLUE:['BLUE',C0],RED:['RED',C1],SYN:['THE SYNERGISTS',GRN],CEO:['THE CEO',HAZ]};
const INTRO={
 1:[['BEEP','Welcome to the Pong Primary, brought to you by Anonymous Donors. Dark money, as always.','i1_1'],['BEEP','Two paddles enter. One paddle wins. The other demands a recount.','i1_2'],['RED','I will crush you.','i1_3'],['BLUE','Bold words from a rectangle.','i1_4'],['BEEP','Paddles are now armed. A hit takes a little of your rival\'s money. At zero dollars, they lose a life. Fire with the FIRE button or Space.','i1_5'],['BEEP','First to 3 points, or last paddle with a life. Remember: both sides are exactly the same, according to me.','i1_6']],
 2:[['BEEP','Management has added blocks. They are called procedural obstacles. Nobody voted on them.','i2_1'],['BEEP','Blocks give money. Money is how you win here. Please do not ask follow-up questions.','i2_2']],
 3:[['BEEP','More blocks! Congress calls this a bipartisan compromise. It is just more blocks.','i3_1'],['BEEP','The blocks were funded by lobbyists.','i3_2'],['BEEP','Some blocks hide bonuses. We call them loopholes. Only a few people get to use them.','i3_3']],
 4:[['BEEP','BREAKING NEWS. Earth has been bought by the Synergists of Hostile Takeover Galactic. Terms and conditions apply.','i4_1'],['SYN','We are acquiring your court. Prices will rise. Services will fall. You are the product.','i4_2'],['BLUE','Red, this might be a good time to work together.','i4_3'],['RED','I would rather lose.','i4_4'],['BEEP','Then you will lose together. Pass the ball back and forth. Cooperation multiplies your money. Allegedly.','i4_5'],['BEEP','If your partner falls, spend your money to revive them. It is basically healthcare. Do not tell the shareholders.','i4_6'],['BEEP','Friendly fire is ON. Aim at the mothership with the yacht, not at each other. Shareholders will not reimburse you.','i4_7']]
};
const WINL={
 1:[['BEEP','Round over! Your prize: a tax cut for someone else.','w1_1']],
 2:[['BEEP','Another round. Another coupon. The economy is, officially, great.','w2_1']],
 3:[['BEEP','Excellent! Wait. Why is the sky doing that?','w3_1']]
};
const BOSS_INTRO=[['CEO','I am the Chief Executive Officer. I pay no taxes. I have lawyers.','b_1'],['BEEP','Hit him with the ball and shoot him. Alternate hits to build the rally. Solidarity rules.','b_2']];
const WIN_END=[['CEO','Restructuring... failed... somebody call my lobbyist...','end_1'],['BEEP','Peace is restored! The Synergists have been taxed. Fairly.','end_2'],['BLUE','Told you teamwork works.','end_3'],['RED','I carried.','end_4'],['BLUE','You did not.','end_5'],['BEEP','And that is why democracy survives. Barely. Thanks for playing! Go vote.','end_6']];
const QUIPS=['We are disrupting your court. Disruption is a feature.','New junk fee detected. It is you.','Let us circle back. With lasers.','This wave is sponsored by deregulation.'];
const DOWNQ=['Paddle down! Your partner can pay to revive you. It is basically healthcare.','Another one gone. Thoughts and prayers.','Down! Your claim has been denied. Please appeal.'];
const REVQ=['Revived! Coverage restored. Premiums may rise.','Back from the dead. Pre-existing condition waived.','Paid in full. Receipt emailed to nobody.'];
const GAG=['The Synergists have acquired the court. Shareholders are thrilled.','Your paddles were let go. Severance: a coupon.','Cause of defeat: partisan gridlock.','Teamwork would have helped. Just saying.'];
const CALL={rapid:['BEEP','Rapid fire!'],wide:['BEEP','Wide paddle!'],spread:['BEEP','Triple shot!'],oneup:['BEEP','One up!'],cash:['BEEP','Bonus cash!'],bankrupt:['BEEP','Bankrupt! Emergency loan issued.'],waveclear:['BEEP','Wave clear. Team bonus.'],boss:['CEO','Time for your performance review.']};
const PU={c:{l:'$',col:GRN,k:'cash'},r:{l:'R',col:ORG,k:'rapid'},w:{l:'W',col:C0,k:'wide'},s:{l:'S',col:C1,k:'spread'},u:{l:'+',col:HAZ,k:'oneup'}};
function voiceList(){
  const out=[],add=(key,who,t,cat,lv)=>out.push([key+'.mp3',key,cat,lv,t,SP[who][0]]);
  for(const o of [INTRO,WINL])for(const k in o)for(const L of o[k])add(L[2],L[0],L[1],'Story','crit');
  BOSS_INTRO.forEach(L=>add(L[2],L[0],L[1],'Boss','crit'));WIN_END.forEach(L=>add(L[2],L[0],L[1],'Story','crit'));
  QUIPS.forEach((t,i)=>add('wave_q_'+i,'SYN',t,'Waves','info'));
  DOWNQ.forEach((t,i)=>add('down_'+i,'BEEP',t,'Combat','info'));REVQ.forEach((t,i)=>add('rev_'+i,'BEEP',t,'Combat','info'));
  GAG.forEach((t,i)=>add('over_'+i,'BEEP',t,'Game over','crit'));
  for(const k in CALL)add(k,CALL[k][0],CALL[k][1],'Callouts','info');
  return out;
}

/* ---------- helpers ---------- */
function say(t,col,dur){msg={t,col:col||YEL,l:dur||2.4,m:dur||2.4}}
function burst(x,y,col,n,sp){for(let i=0;i<(n||14);i++){const a=Math.random()*6.283,s=(sp||170)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,m:.9,c:col})}}
function pop(x,y,t,col){pops.push({x,y,t,c:col,l:1.1})}
function mult(){return clamp(rally,1,5)}
function award(i,n,x,y){if(i<0)return;const v=level>=4?n*mult():n;P[i].score+=v;pop(x,y,'+$'+v,P[i].col)}
function norm(){const s=ball.sp;const m=Math.hypot(ball.vx,ball.vy)||1;ball.vx*=s/m;ball.vy*=s/m;const mn=s*.3;if(Math.abs(ball.vy)<mn){ball.vy=(ball.vy<0?-1:1)*mn;ball.vx=(ball.vx<0?-1:1)*Math.sqrt(s*s-mn*mn)}}
function serve(toward){ball.x=W/2+rnd(-40,40);ball.y=MID;ball.sp=level>=4?300:270;const a=rnd(-.5,.5),d=toward===0?1:-1;ball.vx=Math.sin(a)*ball.sp;ball.vy=d*Math.cos(a)*ball.sp;ball.last=-1;ball.tr.length=0;serveT=.9;rally=0}
const cpu=i=>attract||(mode===1&&i===1);
const reviveCost=()=>300+100*Math.min(5,revives);

/* ---------- levels ---------- */
function setupLevel(){
  blocks=[];pts=[0,0];aliens=[];bolts=[];boss=null;shots=[];crates=[];
  if(level<4)for(const p of P){p.lives=3;p.alive=true}
  const L={2:[[1,-1],[4,-1],[1,1],[4,1],[2,-2],[3,2]],3:[]};
  if(level===3){for(let c=0;c<6;c++){L[3].push([c,-1],[c,1]);if(c>0&&c<5)L[3].push([c,-2],[c,2])}}
  const bw=44,bh=16,g=4,sx=(W-(6*bw+5*g))/2,cols=['#ff4d5e','#ffa53c','#ffe34d','#7dff6b','#19e6ff'];
  for(const [c,r] of (L[level]||[])){
    const cy=MID+(r<0?-1:1)*(Math.abs(r)===1?34:58);
    blocks.push({x:sx+c*(bw+g),y:cy-bh/2,w:bw,h:bh,a:true,bonus:null,col:cols[(c+Math.abs(r))%5]});
  }
  if(level===3){const ty=['r','s','c'];const idx=blocks.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,3);idx.forEach((bi,k)=>blocks[bi].bonus=ty[k])}
}
function dialog(lines,cb){dlg={lines,i:0,c:0,cb};state='dialog';voice(lines[0][2])}
function advance(){
  if(!dlg)return;const L=dlg.lines[dlg.i];
  if(dlg.c<L[1].length){dlg.c=L[1].length;return}
  dlg.i++;dlg.c=0;sfx.blip();
  if(dlg.i>=dlg.lines.length){const cb=dlg.cb;dlg=null;cb&&cb()}else voice(dlg.lines[dlg.i][2])
}
function startGame(m){
  mode=m;attract=false;level=1;wave=0;revives=0;bestRally=0;firstDown=true;
  for(const p of P){p.score=100;p.lives=3;p.alive=true;p.inv=0;p.x=p.tx=W/2;resetP(p)}
  P[1].err=60;P[1].sp=190;
  setupLevel();
  dialog(INTRO[1],()=>{state='play';serve(0);say(TOUCH?(m===1?'Drag to move. Hold FIRE to shoot.':'Drag in your half. Thumb on FIRE.'):'Mouse or arrows move. Click or SPACE fires'+(m===2?'. RED: A/D + Enter':''),C0,3.5)});
}
function goTitle(){
  state='title';attract=true;level=1;wave=0;blocks=[];aliens=[];bolts=[];boss=null;shots=[];crates=[];parts=[];pops=[];msg=null;
  for(const p of P){p.lives=3;p.alive=true;p.inv=0;p.err=22;p.sp=300;resetP(p)}
  serve(0);
}
function levelWin(i){
  P[i].score+=100;sfx.win();burst(W/2,MID,P[i].col,40,260);
  const old=level;level++;setupLevel();
  const cb=()=>{if(level>=4)startInvasion();else{state='play';serve(i===0?1:0)}};
  dialog(WINL[old].concat(INTRO[level]),cb);
}
function startInvasion(){
  for(const p of P){p.lives=3;p.alive=true;p.inv=1.5;p.err=18;p.sp=330;resetP(p)}
  wave=1;crateT=6;state='play';serve(0);startWave();
}
function startWave(){
  snap={wave,boss:false,score:[P[0].score,P[1].score]};
  spawned=0;spawnT=1.4;waveState='spawn';aliens=[];bolts=[];sfx.wave();
  say('WAVE '+wave+'. '+QUIPS[wave-1],GRN,3);voice('wave_q_'+(wave-1));
}
const WAVES=[{n:6,t:['d']},{n:9,t:['d','d','s']},{n:12,t:['d','s','h']},{n:14,t:['d','s','s','h']}];
function spawnAlien(k,sx,tx,ty,delay){
  const kind=k||pick(WAVES[Math.max(0,Math.min(3,wave-1))].t);sideFlip=-sideFlip;const side=sideFlip;
  const S={x:sx==null?(Math.random()<.5?-30:W+30):sx,y:MID+(Math.random()<.5?-1:1)*rnd(90,150)};
  const T2={x:tx==null?rnd(40,W-40):tx,y:ty==null?MID+side*rnd(16,40):ty};
  aliens.push({k:kind,x:S.x,y:S.y,S,T:T2,ent:0,dur:1.7,R:rnd(45,65),sg:S.x<W/2?1:-1,hold:.7,side,r:kind==='h'?17:14,hp:kind==='h'?3:kind==='s'?2:1,vy:(18+wave*5)*(kind==='h'?.65:kind==='s'?.85:1),born:delay||0,tm:0,ph:rnd(0,6),ft:rnd(1.5,3),fl:0,dead:false,shoots:kind==='s'});
}
function spawnSquad(m){
  const sx=Math.random()<.5?-30:W+30,y0=MID+(Math.random()<.5?-1:1)*rnd(90,150);
  tone(300,.35,'sawtooth',.03,700);
  for(let i=0;i<m;i++){
    spawnAlien(null,sx,m===1?W/2:50+i*(W-100)/(m-1),null,i*.28);
    const a=aliens[aliens.length-1];a.S.y=y0;a.y=y0;
  }
}
function waveClear(){
  waveState='clear';clearT=2.4;P[0].score+=50;P[1].score+=50;sfx.win();
  say('WAVE CLEAR. Team bonus +$50 each',YEL,2.2);voice('waveclear');
}
function startBoss(){
  aliens=[];bolts=[];
  snap={wave:5,boss:true,score:[P[0].score,P[1].score]};
  dialog(BOSS_INTRO,()=>{launchBoss();state='play';serveT=.9});
}
function launchBoss(){boss={x:W/2,y:MID,w:52,h:30,hp:30,max:30,t:0,ft:2,st:4,side:1,cd:0,fl:0};say('BOSS: THE CEO',HAZ,2.5);sfx.wave();voice('boss')}
function bossDead(){
  burst(boss.x,boss.y,HAZ,60,320);burst(boss.x,boss.y,YEL,40,260);sfx.win();shake=14;boss=null;aliens=[];bolts=[];
  P[0].score+=300;P[1].score+=300;
  dialog(WIN_END,()=>{finish()});
}
function finish(){
  const tot=P[0].score+P[1].score;if(tot>best){best=tot;try{localStorage.setItem('ce_best',best)}catch(e){}}
  winRank=bestRally>=8?'RANK S: ACTUAL FRIENDS':bestRally>=5?'RANK A: COWORKERS':bestRally>=3?'RANK B: ROOMMATES':'RANK C: FRENEMIES';
  state='win';
}
function gameOver(){state='over';{const k=Math.random()*GAG.length|0;overLine=GAG[k];voice('over_'+k)}sfx.miss();shake=10}
function retry(){
  aliens=[];bolts=[];parts=[];pops=[];boss=null;shots=[];crates=[];
  P[0].score=snap.score[0];P[1].score=snap.score[1];
  for(const p of P){p.lives=3;p.alive=true;p.inv=1.5;p.x=p.tx=W/2;resetP(p)}
  state='play';
  if(snap.boss){launchBoss();serve(0)}else{wave=snap.wave;serve(0);startWave()}
}

/* ---------- damage / revive ---------- */
function hurt(i){
  const p=P[i];if(p.inv>0||!p.alive)return;
  p.lives--;p.inv=1.3;shake=8;sfx.hurt();burst(p.x,p.y,p.col,20,200);
  if(p.lives<=0){
    p.alive=false;burst(p.x,p.y,'#ffffff',30,260);
    if(!P[0].alive&&!P[1].alive){gameOver();return}
    {const k=firstDown?0:Math.random()*DOWNQ.length|0;say(DOWNQ[k],HAZ,3);voice('down_'+k);firstDown=false}
    if(mode===1&&i===0)revT=2.2;
  }
}
function tryRevive(by){
  const s=P[by],t=P[1-by];if(!s.alive||t.alive||state!=='play')return;
  const cost=reviveCost();
  if(s.score<cost){say('Need $'+(cost-s.score)+' more to revive',ORG,1.6);return}
  s.score-=cost;revives++;t.alive=true;t.lives=2;t.inv=2.5;t.x=t.tx=W/2;
  sfx.revive();burst(t.x,t.y,t.col,40,240);pop(t.x,t.y+(t.i?40:-40),'REVIVED',t.col);{const k=Math.random()*REVQ.length|0;say(REVQ[k],YEL,2.4);voice('rev_'+k)}
}
function breach(a,tp){
  burst(a.x,a.y,GRN,16);
  if(tp.alive)hurt(tp.i);
  else{const s=P[1-tp.i];if(s.alive){loseMoney(s.i,75);sfx.hurt()}}
}

/* ---------- weapons / money / bonuses ---------- */
function loseMoney(i,n){
  const p=P[i];if(!p.alive)return;
  p.score-=n;pop(p.x,p.y+(i?34:-34),'-$'+n,HAZ);
  if(p.score<=0){
    p.score=50;voice('bankrupt');
    if(level<4){
      p.lives--;sfx.hurt();shake=8;burst(p.x,p.y,p.col,24,200);
      if(p.lives<=0)levelWin(1-i);else say('BANKRUPT! -1 life. Emergency loan: $50',HAZ,2.6);
    }else{say('BANKRUPT! Emergency loan: $50',HAZ,2.4);p.inv=0;hurt(i)}
  }
}
function fire(p){
  if(state!=='play'||attract||!p.alive||p.fcd>0)return;
  const dir=p.i===0?-1:1;p.fcd=p.rapid>0?.13:.32;
  const xs=p.spread>0?[-12,0,12]:[0];
  for(const o of xs)shots.push({x:p.x+o,y:p.y+dir*8,vy:dir*440,vx:o*2.5,i:p.i,dead:false});
  sfx.shoot();
}
function cpuFire(p,dt){
  if(p.fcd>0||!p.alive)return;const dir=p.i===0?-1:1;
  if(level<4){const o=P[1-p.i];if(o.alive&&Math.abs(o.x-p.x)<o.w/2&&Math.random()<dt*(1.2+level*.4))fire(p)}

  for(const ed of M.e){const a=pv[ed[0]],b=pv[ed[1]],Q=(a[2]+b[2])/2>=zc?B:A;Q.moveTo(a[0],a[1]);Q.lineTo(b[0],b[1])}
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=col;const g=ctx.globalAlpha*(al==null?1:al);
  ctx.globalAlpha=g*.4;ctx.lineWidth=lw*.8;ctx.stroke(A);
  ctx.globalAlpha=g*.2;ctx.lineWidth=lw*3.2;ctx.stroke(B);
  ctx.globalAlpha=g;ctx.lineWidth=lw;ctx.stroke(B);ctx.restore();
}
function drawBG(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#050914';ctx.fillRect(0,0,IW,IH);
  ctx.setTransform(DPR*S,0,0,DPR*S,OX*DPR,OY*DPR);
  const threat=level>=4&&!attract?clamp(.3+wave*.15,0,1):0,hue=225-threat*200;
  const x0=-OX/S,x1=W+OX/S,y0=-OY/S,y1=H+OY/S;
  ctx.strokeStyle='hsla('+hue+',90%,60%,.09)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=Math.floor(x0/30)*30;x<=x1;x+=30){ctx.moveTo(x,y0);ctx.lineTo(x,y1)}
  const off=(T*8)%30;for(let y=Math.floor(y0/30)*30-30+off;y<=y1;y+=30){ctx.moveTo(x0,y);ctx.lineTo(x1,y)}
  ctx.stroke();
  neon('hsla('+hue+',100%,65%,.5)',1.5,()=>{ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(0,y1);ctx.moveTo(W,y0);ctx.lineTo(W,y1)});
  if(level<4||attract){ctx.save();ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,MID);ctx.lineTo(W,MID);ctx.stroke();ctx.restore()}
  else{
    ctx.save();ctx.setLineDash([3,9]);ctx.strokeStyle='rgba(255,77,94,.3)';ctx.lineWidth=1.5;ctx.beginPath();
    ctx.moveTo(0,P[0].y-18);ctx.lineTo(W,P[0].y-18);ctx.moveTo(0,P[1].y+18);ctx.lineTo(W,P[1].y+18);ctx.stroke();ctx.restore();
  }
}
function drawPaddle(p){
  const x=p.x,y=p.y;
  if(!p.alive){
    ctx.save();ctx.globalAlpha=.35;ctx.setLineDash([4,5]);ctx.strokeStyle=p.col;ctx.lineWidth=2;rr(x-p.w/2,y-5,p.w,10,5);ctx.stroke();ctx.restore();
    txt('x_x',x,y+(p.i?22:-22),13,HAZ,'center',.8,false);return;
  }
  if(p.inv>0&&((T*14)|0)%2)return;
  const vx=(x-(p.lx==null?x:p.lx))*60;p.lx=x;p.vs=(p.vs||0)*.85+vx*.15;
  const w=p.w+(p.hit>0?6:0),sw=Math.sin(T*.9+p.i*2)*.07+clamp(p.vs*.0007,-.22,.22);
  mesh3(M_PAD[p.i],x,y,w/2,1,1,p.i?-.55:.55,sw,p.hit>0?'#ffffff':p.col,1.8,1);
}
function drawBall(){
  const oc=ball.last<0?'#ffffff':P[ball.last].col;
  if(ball.tr.length>1){
    ctx.save();ctx.lineCap='round';
    for(let i=1;i<ball.tr.length;i++){ctx.globalAlpha=i/ball.tr.length*.5;ctx.strokeStyle=oc;ctx.lineWidth=1+i*.5;ctx.beginPath();ctx.moveTo(ball.tr[i-1][0],ball.tr[i-1][1]);ctx.lineTo(ball.tr[i][0],ball.tr[i][1]);ctx.stroke()}
    ctx.restore();
  }
  const pr=serveT>0?1+.25*Math.sin(T*16):1;
  const br=ball.r*1.25*pr;mesh3(M_SPH,ball.x,ball.y,br,br,br,T*3,T*4.2,oc,1.6,1);
  ctx.save();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*.4*pr,0,6.283);ctx.fill();ctx.restore();

function drawAlien(a){
  if(a.born>0)return;
  const col=a.fl>0?'#ffffff':a.k==='d'?GRN:a.k==='s'?ORG:HAZ,r=a.r,sy=r*a.side,sp=a.ent<1?(1-a.ent)*12.566:0,rx=.4;

  if(a.k==='d'){mesh3(M_CRAB[Math.floor(a.tm*3)%2],a.x,a.y,r,sy,r,rx,ry,col,1.6,1)}

function drawBoss(){

  neon(col,1.6,()=>{ctx.beginPath();ctx.moveTo(b.x-b.w*.4,b.y-b.h);ctx.lineTo(b.x-b.w*.6,b.y-b.h-12);ctx.moveTo(b.x+b.w*.4,b.y-b.h);ctx.lineTo(b.x+b.w*.6,b.y-b.h-12);ctx.moveTo(b.x-b.w*.4,b.y+b.h);ctx.lineTo(b.x-b.w*.6,b.y+b.h+12);ctx.moveTo(b.x+b.w*.4,b.y+b.h);ctx.lineTo(b.x+b.w*.6,b.y+b.h+12)},2.4);

function drawScene(){
  for(const b of blocks){if(!b.a)continue;mesh3(M_BOX,b.x+b.w/2,b.y+b.h/2,b.w/2-1,b.h/2-1,5,.45,.18,b.col,1.5,1);if(b.bonus){neon('#ffffff',1.2,()=>rr(b.x-2,b.y-2,b.w+4,b.h+4,4),2);txt(PU[b.bonus].l,b.x+b.w/2,b.y+b.h/2+1,12,'#fff','center',.5+.5*Math.sin(T*6),false)}}
  for(const a of aliens)drawAlien(a);
  if(boss)drawBoss();
  for(const b of bolts){neon(ORG,2,()=>{ctx.beginPath();ctx.moveTo(b.x,b.y-4*Math.sign(b.vy));ctx.lineTo(b.x+3,b.y);ctx.lineTo(b.x,b.y+4*Math.sign(b.vy));ctx.lineTo(b.x-3,b.y);ctx.closePath()},2.5)}
  for(const c of crates){const d=PU[c.t];if(c.l<3&&((T*8)|0)%2)continue;mesh3(M_BOX,c.x,c.y,c.w/2-2,c.h/2,c.h/2,T*1.2,T*1.7,d.col,1.8,1);mesh3(M_BOX,c.x,c.y,6,6,6,-T,T*2,'#ffffff',1,.7);txt(d.l,c.x,c.y+1,13,d.col,'center',1,false)}
  for(const s of shots){neon(P[s.i].col,2,()=>{ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*.02,s.y-Math.sign(s.vy)*9)},2.6)}
  drawBall();

  ctx.save();ctx.lineWidth=2;ctx.lineCap='round';
  for(const q of parts){ctx.globalAlpha=clamp(q.l/q.m,0,1);ctx.strokeStyle=q.c;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*.04,q.y-q.vy*.04);ctx.stroke()}
  ctx.restore();
  for(const q of pops)txt(q.t,q.x,q.y,13,q.c,'center',clamp(q.l*1.5,0,1));
}
function drawHUD(){
  if(level<4){
    txt(pts[1],W-34,MID-48,44,C1,'center',.2,false);txt(pts[0],W-34,MID+48,44,C0,'center',.2,false);

  }else{
    txt('WAVE '+Math.min(wave,4)+'/4',10,MID-14,11,'#ffffff','left',.45,false);

  for(const p of P){
    const y=p.i?p.y-42:p.y+42,nm=mode===1?(p.i?'RED CPU':'YOU'):(p.i?'RED':'BLUE');

    for(let k=0;k<3;k++){const x=W-18-k*22;ctx.save();ctx.globalAlpha=k<p.lives?1:.18;ctx.restore();
      if(k<p.lives)neon(p.col,1.6,()=>rr(x-8,y-3,16,6,3),2.4);else{ctx.save();ctx.globalAlpha=.2;ctx.strokeStyle=p.col;ctx.lineWidth=1;rr(x-8,y-3,16,6,3);ctx.stroke();ctx.restore()}}
  }
  if(level>=4&&!attract){
    for(const s of P){
      const o=P[1-s.i];
      if(s.alive&&!o.alive&&state==='play'){
        const c=reviveCost(),can=s.score>=c;
        const y=s.i===0?P[0].y-86:P[1].y+56;

        btn('REVIVE '+(mode===1?'CPU':(o.i?'RED':'BLUE'))+'  -$'+c,W/2-105,y,210,34,can?YEL:'#8899aa',()=>tryRevive(s.i),can?1:.7);
      }
    }
  }
  if(state==='play'&&!attract){
    for(const p of P){
      if(mode===1&&p.i===1)continue;if(!p.alive)continue;
      const fx=p.i===0?W-40:40,fy=p.i===0?p.y-52:p.y+52,held=[...fireHold.values()].includes(p.i)||p.fcd>.2;

      ctx.save();ctx.fillStyle=held?'rgba(255,255,255,.14)':'rgba(5,9,20,.55)';ctx.beginPath();ctx.arc(fx,fy,26,0,6.283);ctx.fill();ctx.restore();

    }

    ctx.save();ctx.font='700 13px '+FONT;const L=wrap(msg.t,300),h=L.length*18+14,y=MID-110-h/2;
    ctx.globalAlpha=a*.8;ctx.fillStyle='#050914';rr(W/2-160,y,320,h,10);ctx.fill();ctx.restore();
    ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=msg.col;ctx.lineWidth=1.5;rr(W/2-160,y,320,h,10);ctx.stroke();ctx.restore();
    L.forEach((l,i)=>txt(l,W/2,y+16+i*18,13,msg.col,'center',a,false));
  }
}
function drawDialog(){

  const L=dlg.lines[dlg.i],sp=SP[L[0]],bx=18,bw=W-36,by=MID-110,bh=220;

function drawTitle(){

function draw(){
  btns=[];fbtn=[];drawBG();
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake)*.5,rnd(-shake,shake)*.5);
  drawScene();
  if(state==='play')drawHUD();
  else if(state==='dialog'){drawHUD()}
  ctx.restore();
  if(state==='title')drawTitle();
  else if(state==='dialog'&&dlg)drawDialog();
  else if(state==='over')drawOver();
  else if(state==='win')drawWin();
}

/* ---------- input ---------- */
const pt=e=>[(e.clientX-OX)/S,(e.clientY-OY)/S];
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();ac();if(!unl){unl=true;curTrack=null}try{window.focus();cv.focus({preventScroll:true})}catch(_){}const [x,y]=pt(e);
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(state==='play'&&!attract){for(const f of fbtn){if(Math.hypot(x-f.x,y-f.y)<=f.r+10){fireHold.set(e.pointerId,f.i);fire(P[f.i]);return}}}
  for(const b of btns){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return}}
  if(state==='dialog'){advance();return}
  if(state==='play'){const i=mode===2&&y<MID?1:0;if(e.pointerType==='mouse'){fireHold.set(e.pointerId,i);fire(P[i]);P[i].tx=x}else{ctl.set(e.pointerId,i);P[i].tx=x}}
},{passive:false});
cv.addEventListener('pointermove',e=>{e.preventDefault();if(ctl.has(e.pointerId))P[ctl.get(e.pointerId)].tx=pt(e)[0];else if(e.pointerType==='mouse'&&state==='play'&&!attract){const [x,y]=pt(e);P[mode===2&&y<MID?1:0].tx=x}},{passive:false});
const up=e=>{ctl.delete(e.pointerId);fireHold.delete(e.pointerId)};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
const KM={Space:' ',Enter:'Enter',NumpadEnter:'Enter',KeyA:'a',KeyD:'d',KeyW:'w',KeyR:'r',KeyT:'t',Digit1:'1',Digit2:'2',Numpad1:'1',Numpad2:'2'};
const kn=e=>KM[e.code]||(e.key&&e.key.length===1?e.key.toLowerCase():e.key);
function onKey(e,down){
  const k=kn(e);if(!k)return;
  if(k===' '||k.startsWith('Arrow'))e.preventDefault();
  if(down){
    ac();if(!unl){unl=true;curTrack=null}
    if(!e.repeat){
      if(state==='dialog'&&(k===' '||k==='Enter'||k==='ArrowRight'))advance();
      else if(state==='title'&&(k==='1'||k==='Enter'||k===' '))startGame(1);
      else if(state==='title'&&k==='2')startGame(2);
      else if(state==='play'){if(k==='r')tryRevive(0);if(k==='t'&&mode===2)tryRevive(1)}
      else if(state==='over'&&(k==='Enter'||k===' '))retry();
      else if(state==='win'&&(k==='Enter'||k===' '))startGame(mode);
    }
  }
  keys[k]=down;
}
addEventListener('keydown',e=>onKey(e,true),true);
addEventListener('keyup',e=>onKey(e,false),true);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)ctl.clear()});

/* ---------- boot ---------- */
layout();goTitle();
let lastT=performance.now();
function frame(t){const dt=Math.min(.033,(t-lastT)/1000);lastT=t;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.__ce={update,draw,P,startGame,advance,tryRevive,ball,fire,grant,loseMoney,voiceList,
  get s(){return{state,level,wave,boss:!!boss,aliens:aliens.length,pts,rally,bestRally,revives,shots:shots.length,crates:crates.length,money:[P[0].score,P[1].score],lives:[P[0].lives,P[1].lives]}},
  force(o){if('lives0' in o)P[0].lives=o.lives0;if('hp' in o&&boss)boss.hp=o.hp},get dlg(){return dlg},get btns(){return btns}};
})();
</script></body></html>
