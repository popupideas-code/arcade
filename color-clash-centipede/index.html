<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070913">
<title>Color Clash Centipede</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start}
  canvas{display:block;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';

/* ============================================================
   COLOR CLASH CENTIPEDE  v2
   Hex-grid bubble shooter + centipede. Single file, no deps.
   ============================================================ */

const COLS = 10;          // balls in an even row
const GR = 40;            // allocated grid rows
const PALETTE = ['#ff4d5e', '#3da5ff', '#3ddc84', '#ffd93d', '#b66dff', '#ff9a3d'];
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const POWER_TYPES = ['rainbow', 'bomb', 'laser', 'freeze'];
const MAX_POWERS = 3;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ---------- layout ---------- */
let cw = 0, ch = 0, dpr = 1, d = 0, rowH = 0, y0 = 0, ROWS = 10, dangerY = 0, boardBottom = 0, groundY = 0;
const hudH = 36;
const shooter = { x: 0, y: 0 };
const slotNext = { x: 0, y: 0 };
let sprites = [], mushWedge = null, mushTop = null, poopSprite = null;

/* ---------- RNG (gameplay uses rng so DAILY can be seeded) ---------- */
let rng = Math.random;
const rnd = n => Math.floor(rng() * n);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- state ---------- */
const G = {
  mode: 'title',            // title | playing | levelclear | gameover
  variant: 'levels',        // levels | endless | daily
  level: 1, score: 0, combo: 0, streak: 0,
  bests: { levels: 0, endless: 0, daily: 0 },
  grid: [], cens: [], pending: [], spits: [],
  proj: null, loaded: 0, next: 1, angle: 0,
  powers: [], armedIdx: -1, freeze: 0, gunk: 0,
  parts: [], texts: [], calls: [], beams: [], decals: [], trail: [],
  pal: [0, 1, 2], time: 0, overlayT: 0, shake: 0, recoil: 0, hitstop: 0,
  shots: 0, shotsLevel: 0, startColored: 0, maxRow: 0, bonus: null, bossDone: false, banner: null
};
try {
  ['levels', 'endless', 'daily'].forEach(k => { G.bests[k] = +localStorage.getItem('ccc_best_' + k) || 0; });
} catch (e) {}
let muted = false;
try { muted = localStorage.getItem('ccc_mute') === '1'; } catch (e) {}

/* ---------- hex grid helpers ----------
   even rows: COLS cells, x = d*(c+0.5);  odd rows: COLS-1 cells, x = d*(c+1)
   row -1 is the centipede's entry corridor (never holds balls). */
const par = r => ((r % 2) + 2) % 2;
const colsOf = r => (par(r) === 0 ? COLS : COLS - 1);
const cellX = (r, c) => d * (c + (par(r) === 0 ? 0.5 : 1));
const cellY = r => y0 + r * rowH;
const validCell = (r, c) => r >= 0 && r < GR && c >= 0 && c < colsOf(r);
const getItem = (r, c) => (validCell(r, c) ? G.grid[r][c] : null);
function nbrs(r, c) {
  return par(r) === 0
    ? [[r, c - 1], [r, c + 1], [r - 1, c - 1], [r - 1, c], [r + 1, c - 1], [r + 1, c]]
    : [[r, c - 1], [r, c + 1], [r - 1, c], [r - 1, c + 1], [r + 1, c], [r + 1, c + 1]];
}
function lowerN(r, c) { return par(r) === 0 ? [[r + 1, c - 1], [r + 1, c]] : [[r + 1, c], [r + 1, c + 1]]; }
// item types: 0 colored egg, 1 wild mushroom, 2 poop pellet (unbreakable)
const mk = (t, col, delay) => ({ t, col, born: G.time + (delay || 0), wa: 0, wt: 0, wdx: 0, wdy: 0 });

/* ---------- worlds ---------- */
const THEMES = [
  { name: 'GARDEN', sky: ['#173a63', '#1b4d3a'], ground: '#2c7a33', edge: '#5ccf52' },
  { name: 'CAVE',   sky: ['#1d1233', '#0a0714'], ground: '#4b3a63', edge: '#8a6fb8' },
  { name: 'SEWER',  sky: ['#0f2d2b', '#07130f'], ground: '#3b4a3a', edge: '#7aa05a' },
  { name: 'SPACE',  sky: ['#05071a', '#190b34'], ground: '#6a6a7c', edge: '#a9a9bd' }
];
const themeOf = lv => THEMES[Math.floor((lv - 1) / 3) % THEMES.length];

/* ---------- audio (tiny synth, created on first touch) ---------- */
let AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (muted || !AC) return;
  try {
    const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noise(dur, vol, freq) {
  if (muted || !AC) return;
  try {
    const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq || 1200; g.gain.value = vol || 0.15;
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
  } catch (e) {}
}
const SFX = {
  fire() { tone(560, 240, 0.09, 'square', 0.05); },
  pop(n) { tone(380 + n * 70, 760 + n * 90, 0.12, 'sine', 0.14); },
  stick() { tone(180, 120, 0.06, 'sine', 0.1); },
  chomp() { noise(0.12, 0.2, 900); tone(140, 80, 0.1, 'sawtooth', 0.08); },
  plop() { tone(300, 90, 0.16, 'sine', 0.16); },
  splat() { noise(0.18, 0.22, 700); tone(120, 60, 0.12, 'sine', 0.12); },
  head() { tone(700, 120, 0.4, 'sawtooth', 0.1); tone(900, 300, 0.25, 'square', 0.06, 0.05); },
  hit() { tone(260, 200, 0.08, 'square', 0.08); },
  power() { tone(520, 520, 0.08, 'triangle', 0.12); tone(660, 660, 0.08, 'triangle', 0.12, 0.08); tone(880, 880, 0.14, 'triangle', 0.12, 0.16); },
  boom() { noise(0.45, 0.35, 500); tone(110, 40, 0.4, 'sine', 0.2); },
  laser() { tone(1400, 200, 0.3, 'sawtooth', 0.09); },
  freeze() { tone(1200, 1800, 0.35, 'triangle', 0.1); tone(900, 1500, 0.35, 'triangle', 0.08, 0.1); },
  spit() { tone(240, 480, 0.15, 'sine', 0.1); },
  gunk() { noise(0.3, 0.25, 500); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.18, 'triangle', 0.13, i * 0.1)); },
  over() { [440, 370, 311, 220].forEach((f, i) => tone(f, f * 0.9, 0.25, 'sawtooth', 0.09, i * 0.16)); }
};
function buzz(ms) { try { if (!muted && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- sprites ---------- */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return `rgb(${r},${g},${b})`;
}
function mkSprite(R) {
  const s = Math.ceil((R + 3) * 2 * dpr), c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  return { c, x, size: s / dpr, mid: s / dpr / 2, R };
}
function makeBall(color, idx) {
  const R = d * 0.47, sp = mkSprite(R), x = sp.x, m = sp.mid;
  const g = x.createRadialGradient(m - R * 0.35, m - R * 0.4, R * 0.1, m, m, R);
  g.addColorStop(0, shade(color, 0.55)); g.addColorStop(0.45, color); g.addColorStop(1, shade(color, -0.45));
  x.fillStyle = g; x.beginPath(); x.arc(m, m, R, 0, 7); x.fill();
  // egg pattern (one per color: helps tell colors apart)
  x.save(); x.beginPath(); x.arc(m, m, R - 1, 0, 7); x.clip();
  x.fillStyle = 'rgba(255,255,255,.3)'; x.strokeStyle = 'rgba(255,255,255,.34)';
  x.lineWidth = R * 0.15; x.lineJoin = 'round'; x.lineCap = 'round';
  if (idx === 0) {                                        // dots
    [[-0.42, 0.05], [0.12, 0.46], [0.46, -0.1], [-0.08, -0.5], [0.1, 0.02]].forEach(([a, b]) => { x.beginPath(); x.arc(m + a * R, m + b * R, R * 0.12, 0, 7); x.fill(); });
  } else if (idx === 1) {                                 // bands
    x.fillRect(m - R, m - R * 0.52, R * 2, R * 0.2); x.fillRect(m - R, m + R * 0.12, R * 2, R * 0.2);
  } else if (idx === 2) {                                 // zigzag
    x.beginPath(); x.moveTo(m - R, m + R * 0.1);
    for (let i = 0; i < 6; i++) x.lineTo(m - R + (i + 1) * R * 0.4, m + (i % 2 ? 0.1 : -0.3) * R);
    x.stroke();
  } else if (idx === 3) {                                 // crosses
    [[-0.35, -0.2], [0.35, -0.05], [0, 0.45]].forEach(([a, b]) => {
      x.beginPath(); x.moveTo(m + a * R - R * 0.12, m + b * R); x.lineTo(m + a * R + R * 0.12, m + b * R);
      x.moveTo(m + a * R, m + b * R - R * 0.12); x.lineTo(m + a * R, m + b * R + R * 0.12); x.stroke();
    });
  } else if (idx === 4) {                                 // diagonal stripes
    x.beginPath(); x.moveTo(m - R, m); x.lineTo(m, m - R); x.moveTo(m - R * 0.3, m + R); x.lineTo(m + R, m - R * 0.3); x.stroke();
  } else {                                                // ring
    x.beginPath(); x.arc(m, m, R * 0.42, 0, 7); x.stroke();
  }
  x.restore();
  x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 1.5; x.beginPath(); x.arc(m, m, R, 0, 7); x.stroke();
  x.fillStyle = 'rgba(255,255,255,.38)'; x.beginPath();
  x.ellipse(m - R * 0.3, m - R * 0.42, R * 0.3, R * 0.16, -0.6, 0, 7); x.fill();
  return sp;
}
function makeMushWedge() {
  const R = d * 0.47, sp = mkSprite(R), x = sp.x, m = sp.mid;
  for (let i = 0; i < 6; i++) {
    x.fillStyle = PALETTE[i]; x.beginPath(); x.moveTo(m, m);
    x.arc(m, m, R, i * Math.PI / 3, (i + 1) * Math.PI / 3); x.closePath(); x.fill();
  }
  return sp;
}
function makeMushTop() {
  const R = d * 0.47, sp = mkSprite(R), x = sp.x, m = sp.mid;
  const g = x.createRadialGradient(m - R * 0.3, m - R * 0.35, R * 0.1, m, m, R);
  g.addColorStop(0, 'rgba(255,255,255,.35)'); g.addColorStop(0.6, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
  x.fillStyle = g; x.beginPath(); x.arc(m, m, R, 0, 7); x.fill();
  x.fillStyle = 'rgba(255,255,255,.92)';
  [[-0.38, -0.2, 0.2], [0.3, -0.34, 0.15], [0.05, 0.3, 0.18], [-0.1, -0.5, 0.1]].forEach(([a, b, r]) => {
    x.beginPath(); x.arc(m + a * R, m + b * R, r * R, 0, 7); x.fill();
  });
  x.strokeStyle = '#fff'; x.lineWidth = 2; x.beginPath(); x.arc(m, m, R - 1, 0, 7); x.stroke();
  return sp;
}
function makePoop() {
  const R = d * 0.47, sp = mkSprite(R), x = sp.x, m = sp.mid;
  const blob = (cx, cy, rx, ry) => {
    const g = x.createRadialGradient(cx - rx * 0.3, cy - ry * 0.4, ry * 0.1, cx, cy, Math.max(rx, ry));
    g.addColorStop(0, '#b87a3d'); g.addColorStop(0.6, '#7a4a21'); g.addColorStop(1, '#4a2a10');
    x.fillStyle = g; x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, 7); x.fill();
    x.strokeStyle = '#2e1808'; x.lineWidth = 1.6; x.stroke();
  };
  blob(m, m + R * 0.42, R * 0.92, R * 0.46);
  blob(m, m + R * 0.02, R * 0.68, R * 0.4);
  blob(m, m - R * 0.38, R * 0.42, R * 0.32);
  x.fillStyle = '#7a4a21'; x.beginPath(); x.moveTo(m - R * 0.1, m - R * 0.62); x.quadraticCurveTo(m + R * 0.25, m - R * 0.95, m + R * 0.22, m - R * 0.62); x.closePath(); x.fill();
  x.strokeStyle = '#2e1808'; x.stroke();
  // face
  x.fillStyle = '#fff';
  x.beginPath(); x.arc(m - R * 0.2, m + R * 0.02, R * 0.15, 0, 7); x.fill();
  x.beginPath(); x.arc(m + R * 0.2, m + R * 0.02, R * 0.15, 0, 7); x.fill();
  x.fillStyle = '#111';
  x.beginPath(); x.arc(m - R * 0.18, m + R * 0.05, R * 0.07, 0, 7); x.fill();
  x.beginPath(); x.arc(m + R * 0.22, m + R * 0.05, R * 0.07, 0, 7); x.fill();
  x.strokeStyle = '#2e1808'; x.lineWidth = 1.6; x.beginPath(); x.arc(m, m + R * 0.2, R * 0.16, 0.15, Math.PI - 0.15); x.stroke();
  return sp;
}
function buildSprites() {
  sprites = PALETTE.map((c, i) => makeBall(c, i));
  mushWedge = makeMushWedge(); mushTop = makeMushTop(); poopSprite = makePoop();
}
function drawSprite(sp, x, y, scale) {
  const s = sp.size * (scale || 1);
  ctx.drawImage(sp.c, x - s / 2, y - s / 2, s, s);
}

/* ---------- layout ---------- */
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const iw = window.innerWidth, ih = window.innerHeight;
  cw = Math.floor(Math.min(iw, ih * 0.62, 560)); ch = ih;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  d = cw / COLS; rowH = d * 0.866;
  y0 = hudH + d * 0.5 + rowH;
  boardBottom = ch * 2 / 3;                       // board = top 2/3 of the screen
  ROWS = Math.max(7, Math.floor((boardBottom - d * 0.5 - y0) / rowH) + 1);
  dangerY = y0 + (ROWS - 1) * rowH + d * 0.5 + 3;
  shooter.x = cw / 2; shooter.y = ch - Math.max(d * 2.1, 84);
  slotNext.x = shooter.x - d * 2.7; slotNext.y = shooter.y + d * 0.15;
  groundY = shooter.y + d * 0.82;
  buildSprites();
}
const trayPos = i => ({ x: shooter.x + d * (2.1 + 1.1 * i), y: slotNext.y });

/* ---------- level setup ---------- */
function pickAmmo() {
  const cnt = Array(PALETTE.length).fill(0); let tot = 0;
  for (let r = 0; r < GR; r++) for (let c = 0; c < colsOf(r); c++) {
    const it = G.grid[r] && G.grid[r][c];
    if (it && it.t === 0) { cnt[it.col]++; tot++; }
  }
  if (tot === 0 || rng() < 0.12) return G.pal[rnd(G.pal.length)];
  const present = []; for (let i = 0; i < cnt.length; i++) if (cnt[i]) present.push(i);
  return present[rnd(present.length)];
}
function startLevel(n) {
  G.level = n; G.combo = 0; G.cens = []; G.spits = []; G.proj = null; G.parts = []; G.texts = []; G.calls = [];
  G.beams = []; G.trail = []; G.bonus = null; G.freeze = 0; G.gunk = 0; G.armedIdx = -1; G.bossDone = false;
  G.shotsLevel = 0; G.maxRow = 0;
  const k = Math.min(3 + Math.floor((n - 1) / 2), 6);
  G.pal = Array.from({ length: k }, (_, i) => i);
  G.grid = Array.from({ length: GR }, () => Array(COLS).fill(null));
  const rows = Math.max(3, Math.min(4 + Math.ceil(n / 2), ROWS - 5));
  for (let r = 0; r < rows; r++) for (let c = 0; c < colsOf(r); c++) {
    let col = G.pal[rnd(k)];
    if (rng() < 0.5) {
      const opts = [];
      const l = getItem(r, c - 1); if (l) opts.push(l.col);
      for (const [rr, cc] of nbrs(r, c)) if (rr < r) { const it = getItem(rr, cc); if (it) opts.push(it.col); }
      if (opts.length) col = opts[rnd(opts.length)];
    }
    G.grid[r][c] = mk(0, col, r * 0.06 + c * 0.012);
  }
  G.startColored = countColored();
  const first = Math.max(4, 9 - n * 0.4);
  G.pending = [first];
  if (n >= 6 && n % 5 !== 0) G.pending.push(first + 3);
  G.loaded = pickAmmo(); G.next = pickAmmo();
  G.mode = 'playing'; G.overlayT = 0;
  const th = themeOf(n), boss = n % 5 === 0;
  G.banner = { t: 2.2, a: (G.variant === 'levels' ? 'LEVEL ' : 'WAVE ') + n, b: boss ? 'BOSS INCOMING!' : ((n - 1) % 3 === 0 ? 'WORLD: ' + th.name : '') };
}
function newGame(variant) {
  G.variant = variant || G.variant;
  if (G.variant === 'daily') {
    const dt = new Date(); rng = mulberry32(dt.getFullYear() * 10000 + (dt.getMonth() + 1) * 100 + dt.getDate());
  } else rng = Math.random;
  G.score = 0; G.shots = 0; G.streak = 0; G.powers = [];
  G.decals = [];
  startLevel(1);
}

/* ---------- power-ups ---------- */
function awardPower(x, y) {
  if (G.powers.length >= MAX_POWERS) { G.score += 100; return; }
  const t = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
  G.powers.push(t);
  callout(x, y, 'POWER-UP!', '#ffd93d');
  SFX.power();
}
function usePower(i) {
  const t = G.powers[i];
  if (!t || G.mode !== 'playing') return;
  if (t === 'freeze') {
    G.powers.splice(i, 1);
    if (G.armedIdx > i) G.armedIdx--; else if (G.armedIdx === i) G.armedIdx = -1;
    G.freeze = 5; SFX.freeze(); callout(cw / 2, y0 + d * 3, 'FREEZE!', '#7fd8ff');
  } else G.armedIdx = (G.armedIdx === i) ? -1 : i;
}
function explode(x, y, R) {
  SFX.boom(); G.shake = 0.5; G.hitstop = 0.06; buzz(40);
  ring(x, y, R, '#ffb347');
  for (let i = 0; i < 18; i++) burst(x, y, 3, 1, 420);
  let n = 0;
  for (let r = 0; r < GR; r++) for (let c = 0; c < colsOf(r); c++) {
    const it = G.grid[r][c];
    if (it && Math.hypot(cellX(r, c) - x, cellY(r) - y) < R) { popFx(cellX(r, c), cellY(r), it.t === 0 ? it.col : (it.t === 1 ? -1 : -3)); G.grid[r][c] = null; n++; }
  }
  hitSegs(seg => Math.hypot(seg.x - x, seg.y - y) < R);
  G.score += n * 20; callout(x, y, 'KABOOM!', '#ff7a3d');
  dropHanging(); afterResolve();
}
function fireLaser(a) {
  const ux = Math.sin(a), uy = -Math.cos(a);
  let t = (shooter.y - hudH) / -uy;
  if (ux > 0.001) t = Math.min(t, (cw - shooter.x) / ux); else if (ux < -0.001) t = Math.min(t, -shooter.x / ux);
  const ex = shooter.x + ux * t, ey = shooter.y + uy * t;
  G.beams.push({ x1: shooter.x, y1: shooter.y, x2: ex, y2: ey, life: 0.4 });
  SFX.laser(); G.shake = 0.25; G.combo = 0;
  const dist = (px, py) => {
    const vx = ex - shooter.x, vy = ey - shooter.y, l2 = vx * vx + vy * vy;
    const u = Math.max(0, Math.min(1, ((px - shooter.x) * vx + (py - shooter.y) * vy) / l2));
    return Math.hypot(px - (shooter.x + vx * u), py - (shooter.y + vy * u));
  };
  let n = 0;
  for (let r = 0; r < GR; r++) for (let c = 0; c < colsOf(r); c++) {
    const it = G.grid[r][c];
    if (it && dist(cellX(r, c), cellY(r)) < d * 0.58) { popFx(cellX(r, c), cellY(r), it.t === 0 ? it.col : (it.t === 1 ? -1 : -3)); G.grid[r][c] = null; n++; }
  }
  hitSegs(seg => dist(seg.x, seg.y) < d * 0.62);
  G.score += n * 15;
  if (n) addText(ex, ey + d, 'ZAP +' + n * 15, '#ff8a96');
  dropHanging(); afterResolve();
}
// apply area damage to centipede segments matching test(segPosition)
function hitSegs(test) {
  const hits = [];
  for (const cen of G.cens.slice()) {
    let minIdx = -1;
