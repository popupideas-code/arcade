<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PopUpIdeas Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#06021a;color:#e9f6ff;font:15px/1.4 system-ui,sans-serif}h1{font:400 26px/1 "Audiowide",system-ui,sans-serif;letter-spacing:.12em;margin:0;color:#19f3ff;text-shadow:0 0 14px #19f3ff}.wrap{max-width:980px;margin:0 auto;padding:22px 16px}.sub{color:#a99fd8;margin:6px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}a.card{display:block;text-decoration:none;color:inherit;border:2px solid #7a3cff;border-radius:14px;overflow:hidden;background:#0d0630;box-shadow:0 0 18px rgba(122,60,255,.35);transition:transform .15s,box-shadow .15s}a.card:hover{transform:translateY(-3px);box-shadow:0 0 26px rgba(25,243,255,.55);border-color:#19f3ff}a.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#120845}.b{padding:12px 14px 14px}.t{font:400 17px "Audiowide",system-ui,sans-serif;letter-spacing:.06em;color:#ff2bd6}.new{float:right;font-size:11px;background:#ffe14a;color:#06021a;border-radius:6px;padding:2px 6px;font-weight:700}.d{color:#c9c0f0;font-size:13px;margin-top:4px}.err{color:#ff7a8a} body{background:transparent}.wrap{padding:8px}h1,.sub{display:none}</style></head><body><div class="wrap"><div class="grid" id="g"></div></div>
<script>
// Same gallery as index.html, for pasting into Squarespace. Games open in a new tab. Reports its height to the parent page.
fetch('games.json',{cache:'no-store'}).then(r=>r.json()).then(list=>{
  const g=document.getElementById('g'),now=Date.now();
  list.sort((a,b)=>(b.added||'').localeCompare(a.added||'')).forEach(x=>{
    const isNew=x.added&&now-Date.parse(x.added)<14*864e5;
    const a=document.createElement('a');a.className='card';a.href=x.path;a.target='_blank';a.rel='noopener';
    a.innerHTML=(x.thumb?'<img alt="" src="'+x.thumb+'">':'')+'<div class="b"><div class="t">'+x.title+(isNew?'<span class="new">NEW</span>':'')+'</div><div class="d">'+(x.tagline||'')+'</div></div>';
    g.appendChild(a);
  });
  send();
}).catch(()=>{});
function send(){parent.postMessage({arcadeHeight:document.documentElement.scrollHeight},'*');}
addEventListener('load',()=>{send();setTimeout(send,600);});addEventListener('resize',send);
</script></body></html>
