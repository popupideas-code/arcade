<title>Pocketwave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: full-bleed canvas table, HUD strip on top, control bar on bottom, card overlay for menus */
:root{--bg:#06021a;--ink:#e9f6ff;--mag:#ff2bd6;--cyan:#19f3ff;--yel:#ffe14a;--lime:#7dff4a;--org:#ff7a2b;--vio:#a56bff;--panel:rgba(9,3,32,.82);--disp:'Audiowide','Arial Black',Impact,sans-serif;--mono:'Share Tech Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
html{box-sizing:border-box;height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{position:relative;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.hud{position:absolute;left:0;right:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top{top:0;padding-block:10px 4px}
#bar{bottom:0;padding-block:6px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
#left{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
#items{width:100%;justify-content:space-between}
#right{display:flex;align-items:flex-end;gap:10px}
#left>*,#right>*{pointer-events:auto}
.slider{position:relative;touch-action:none}
#jog{height:52px;border-radius:26px;border:2px solid var(--vio);background:rgba(8,2,30,.7);box-shadow:0 0 12px rgba(165,107,255,.45),inset 0 0 10px rgba(165,107,255,.25)}
#jog::before{content:'';position:absolute;left:50%;top:10px;bottom:10px;width:2px;background:rgba(165,107,255,.45)}
#jog .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:400 11px var(--disp);letter-spacing:.16em;color:var(--vio);opacity:.8}
#jogT{position:absolute;left:50%;top:2px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9c2ff,#a56bff 55%,#5322b5);box-shadow:0 0 16px var(--vio)}
#pw{width:48px;height:128px;border-radius:24px;border:2px solid var(--cyan);background:rgba(8,2,30,.7);box-shadow:0 0 12px rgba(25,243,255,.45),inset 0 0 10px rgba(25,243,255,.25)}
#pwF{position:absolute;left:6px;right:6px;bottom:6px;height:50%;border-radius:20px;background:linear-gradient(0deg,var(--cyan),var(--yel) 65%,var(--mag));opacity:.85}
#pwT{position:absolute;left:-2px;right:-2px;height:14px;margin-top:-7px;border-radius:7px;background:#fff;box-shadow:0 0 12px #fff}
#pwP{position:absolute;left:0;right:0;top:-20px;text-align:center;font:400 12px var(--mono);color:var(--yel);text-shadow:0 0 8px var(--yel)}
#bFire{pointer-events:auto;width:78px;height:78px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#ff9af0,#ff2bd6 55%,#8a0070);color:#fff;font:400 17px var(--disp);letter-spacing:.1em;box-shadow:0 0 26px var(--mag),inset 0 0 14px rgba(255,255,255,.35);text-shadow:0 0 8px #fff;padding:0}
#bFire:active{transform:scale(.93)}
#bFire[disabled]{opacity:.35}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{font-family:var(--disp);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 8px var(--cyan);white-space:nowrap}
#shots{color:var(--yel);text-shadow:0 0 8px var(--yel)}
#shots small{font-family:var(--mono);font-size:11px;color:var(--ink);text-shadow:none;opacity:.7;letter-spacing:.08em}
#pips{display:flex;gap:7px;min-width:0}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--cyan);box-shadow:0 0 8px var(--cyan),inset 0 0 6px var(--cyan);transition:all .3s}
.pip.done{border-color:#4a3d7a;box-shadow:none;background:#2a1f55}
.sub{margin-top:4px;font-size:12px;letter-spacing:.14em;color:#b9a8ff;text-transform:uppercase}
.sub b{color:var(--mag);font-weight:400;text-shadow:0 0 8px var(--mag)}
#items{display:flex;gap:6px;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
.ib{pointer-events:auto;position:relative;width:var(--ibs,38px);height:var(--ibs,38px);border-radius:10px;border:2px solid var(--c,var(--cyan));background:rgba(8,2,30,.7);color:var(--c,var(--cyan));display:grid;place-items:center;padding:0;box-shadow:0 0 10px color-mix(in srgb,var(--c,var(--cyan)) 55%,transparent),inset 0 0 8px color-mix(in srgb,var(--c,var(--cyan)) 30%,transparent);transition:transform .08s,opacity .2s}
.ib:active{transform:scale(.92)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px currentColor)}
.ib .n{position:absolute;right:-5px;top:-7px;min-width:19px;height:19px;border-radius:10px;background:var(--c,var(--cyan));color:#06021a;font-size:12px;line-height:19px;text-align:center;font-weight:700}
.ib.on{background:color-mix(in srgb,var(--c) 32%,#06021a);box-shadow:0 0 18px var(--c),inset 0 0 12px var(--c)}
.ib[disabled]{opacity:.28;pointer-events:none}
.ib:focus-visible,.btn:focus-visible,.lv:focus-visible{outline:2px solid var(--yel);outline-offset:3px}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at center,rgba(6,2,26,.35),rgba(6,2,26,.8))}
#ov.show{display:flex}
#card{width:min(94vw,420px);max-height:100%;overflow:auto;text-align:center;padding:22px 18px 18px;border:2px solid var(--cyan);border-radius:16px;background:var(--panel);box-shadow:0 0 30px rgba(25,243,255,.35),inset 0 0 30px rgba(255,43,214,.12)}
h1{font:400 clamp(34px,11vw,52px)/1 var(--disp);margin:0;letter-spacing:.04em;color:#fff;text-shadow:-3px 0 var(--cyan),3px 0 var(--mag),0 0 22px var(--mag)}
h2{font:400 26px/1.1 var(--disp);margin:0;letter-spacing:.06em;color:var(--yel);text-shadow:0 0 14px var(--yel)}
.tag{margin:10px 0 14px;color:#b9a8ff;letter-spacing:.16em;font-size:12px;text-transform:uppercase}
.how{display:grid;gap:6px;margin:12px 0;text-align:left;font-size:13px;color:#d7ccff;line-height:1.35}
.how i{font-style:normal;color:var(--cyan)}
.btn{pointer-events:auto;display:inline-block;margin:6px 4px 0;padding:12px 22px;min-height:44px;font:400 15px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:#06021a;background:var(--cyan);border:0;border-radius:10px;box-shadow:0 0 18px var(--cyan)}
.btn.alt{background:transparent;color:var(--mag);border:2px solid var(--mag);box-shadow:0 0 12px var(--mag)}
.btn:active{transform:scale(.96)}
.lvls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0 4px}
.lv{min-height:40px;border-radius:8px;border:1.5px solid var(--vio);background:transparent;color:var(--vio);font:400 14px var(--mono);padding:0}
.lv small{display:block;font-size:9px;line-height:1;color:var(--yel);letter-spacing:1px;margin-top:1px}
.lv.cur{border-color:var(--yel);color:var(--yel);box-shadow:0 0 10px var(--yel)}
.lv[disabled]{opacity:.3}
.stars{font-size:40px;letter-spacing:.1em;color:#3a2f6e;margin:8px 0}
.stars b{color:var(--yel);text-shadow:0 0 14px var(--yel);font-weight:400}
.res{margin:10px 0;display:grid;gap:4px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#d7ccff}
.res span{color:var(--lime)}
#pwM{position:absolute;left:-6px;right:-6px;height:3px;margin-top:-1px;background:var(--lime);box-shadow:0 0 8px var(--lime);border-radius:2px;pointer-events:none}
#vrow{margin-top:4px;gap:8px}
.ib.sm{--ibs:34px}
#view{pointer-events:auto;flex:1;height:30px;border-radius:15px;border:2px solid var(--vio);background:rgba(8,2,30,.6);position:relative;box-shadow:0 0 10px rgba(165,107,255,.35);touch-action:none}
#view .vl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 10px var(--disp);letter-spacing:.2em;color:var(--vio);opacity:.7;pointer-events:none}
#viewT{position:absolute;top:2px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9c2ff,#a56bff 60%,#5322b5);box-shadow:0 0 10px var(--vio);pointer-events:none}
.tip{font-size:12px;color:#d7ccff}
.row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cuep{min-width:64px;padding:8px 10px;border-radius:8px;border:2px solid var(--c);background:transparent;color:var(--c);font:400 11px var(--disp);letter-spacing:.08em}
.cuep.sel{background:var(--c);color:#06021a}
.cuep[disabled]{opacity:.3}
@media (min-width:700px){:root{--ibs:54px}.ib.sm{--ibs:44px}#jog{height:72px;border-radius:36px}#jogT{width:62px;height:62px;margin-left:-31px;top:3px}#pw{width:64px;height:200px;border-radius:32px}#bFire{width:112px;height:112px;font-size:22px}#left{max-width:460px}.chip{font-size:16px}#card{width:min(90vw,540px)}#view{height:36px;border-radius:18px}#viewT{width:28px;height:28px;margin-left:-14px}.sub{font-size:14px}}
@media (prefers-reduced-motion:reduce){.pip,.ib{transition:none}}
body.drag #jog,body.drag #pw,body.drag #bFire,body.drag #right{display:none!important}body.drag #items{justify-content:center;gap:16px}
</style>
<canvas id="cv"></canvas>
<div id="crt"></div>
<div class="hud" id="top">
  <div class="row"><div class="chip" id="lvl">LV 01</div><div id="pips"></div><div class="chip" id="shots">0<small>/0</small></div></div>
  <div class="row sub"><span id="scoreL">Score <b id="score">0</b></span><span id="lvname"></span></div>
  <div class="row" id="vrow"><button class="ib sm" id="bPause" aria-label="Pause" style="--c:var(--vio)"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button><div class="slider" id="view" role="slider" aria-label="Rotate view"><div class="vl">VIEW</div><div id="viewT"></div></div><button class="ib sm" id="bZoom" aria-label="Zoom in or out" style="--c:var(--cyan)"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6M10 7v6M7 10h6"/></svg></button></div>
</div>
<div class="hud" id="bar">
  <div id="left">
    <div id="items">
      <button class="ib" id="bSight" aria-label="Long sight" style="--c:var(--cyan)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg><span class="n">0</span></button>
      <button class="ib" id="bMagnet" aria-label="Hole magnet" style="--c:var(--mag)"><svg viewBox="0 0 24 24"><path d="M5 3v9a7 7 0 0 0 14 0V3h-4v9a3 3 0 0 1-6 0V3z"/><path d="M5 7h4M15 7h4"/></svg><span class="n">0</span></button>
      <button class="ib" id="bBrake" aria-label="Brake" style="--c:var(--org)"><svg viewBox="0 0 24 24"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/><path d="M9 12h6"/></svg><span class="n">0</span></button>
      <button class="ib" id="bRew" aria-label="Rewind last shot" style="--c:var(--lime)"><svg viewBox="0 0 24 24"><path d="M11 6l-8 6 8 6zM21 6l-8 6 8 6z"/></svg><span class="n">0</span></button>
      <button class="ib" id="bSpin" aria-label="Curve shot" style="--c:var(--yel)"><svg viewBox="0 0 24 24"><path d="M4 19c0-9 7-13 16-13"/><path d="M15 3l5 3-3 5"/></svg><span class="n">-</span></button>
    </div>
    <div class="slider" id="jog" role="slider" aria-label="Aim"><div class="lbl"><span>&#9664;</span><span>AIM</span><span>&#9654;</span></div><div id="jogT"></div></div>
  </div>
  <div id="right">
    <div class="slider" id="pw" role="slider" aria-label="Shot power"><div id="pwP">55%</div><div id="pwM" hidden></div><div id="pwF"></div><div id="pwT"></div></div>
    <button id="bFire">FIRE</button>
  </div>
</div>
<div id="ov"><div id="card"></div></div>

const cam={yaw:0,yawT:0,pitch:.85,pitchT:.85,D:1600,f:1,cx:0,cy:0,sx:0,sy:0,ca:1,sa:0,cp:1,sp:0,wx:0,wy:0,wz:0,kick:0,zoom:1,zoomT:1,fx:0,fy:0,fxT:0,fyT:0,follow:false};
function camTrig(){cam.ca=Math.cos(cam.yaw);cam.sa=Math.sin(cam.yaw);cam.cp=Math.cos(cam.pitch);cam.sp=Math.sin(cam.pitch);cam.wx=cam.D*cam.sp*cam.sa;cam.wy=cam.D*cam.sp*cam.ca;cam.wz=cam.D*cam.cp;}
function proj(x,y,z,o){const xr=x*cam.ca-y*cam.sa,yr=x*cam.sa+y*cam.ca;const d=cam.D-yr*cam.sp-z*cam.cp,k=cam.f*cam.D/d;o.x=cam.cx+xr*k;o.y=cam.cy+(yr*cam.cp-z*cam.sp)*k;o.k=k;o.d=d;return o;}
function unproj(sx,sy){const u=(sx-cam.cx)/(cam.f*cam.D),v=(sy-cam.cy)/(cam.f*cam.D);const yr=v*cam.D/(cam.cp+v*cam.sp),d=cam.D-yr*cam.sp,xr=u*d;return{x:xr*cam.ca+yr*cam.sa,y:-xr*cam.sa+yr*cam.ca};}

function trace(ox,oy,dx,dy,maxB,skip){

function fire(dx,dy,power){

  const sp=170+power*900;S.cue.vx=dx*sp;S.cue.vy=dy*sp;S.mode='roll';S.rollT=0;S.sunkShot=[];

function placeCue(){
  const L=S.L;let x=L.cue.x,y=L.cue.y,tries=0;
  const bad=()=>S.balls.some(b=>b.id>0&&b.state==='live'&&hyp(b.x-x,b.y-y)<2*BR+6);

function endShot(){
  const objs=S.sunkShot.filter(b=>b.id>0),scratch=S.sunkShot.some(b=>b.id===0),n=objs.length;
  for(const b of objs){
    const tags=[];
    if(b.bn>=2)tags.push('BANK');
    if(b.tp)tags.push('WARP');
    if(S.vs)S.ps[S.turn]++;
    pop(b.hole.x,b.hole.y,tags.length?tags.join(' '):'POCKET',BALLC[b.id].c,17);
  }
  if(n>=2){S.msg=n===2?'DOUBLE POCKET!':n===3?'TRIPLE POCKET!':'MEGA POCKET x'+n;S.msgT=2;S.flashA=1;}
  if(scratch){if(!S.vs)S.shots++;S.msg=S.vs?'SCRATCH!':'SCRATCH! +1 SHOT';S.msgT=2;placeCue();}
  const won=S.balls.every(b=>b.id===0||b.state==='gone');
  if(S.vs&&(!n||scratch)&&!won){S.turn^=1;S.msg='PLAYER '+(S.turn+1);S.msgT=1.8;}

function levelClear(){

    persist();

// ---- 3D prisms (rails, blocks, windmill bars) ----
function prism(pts,z0,z1,fill,top,edge){
  const n=pts.length;let ar=0;for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];ar+=a[0]*b[1]-b[0]*a[1];}const sg=ar>0?1:-1;
  for(let i=0;i<n;i++){
    const a=pts[i],b=pts[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],l=hyp(dx,dy)||1,nx=dy/l*sg,ny=-dx/l*sg;
    if((cam.wx-(a[0]+b[0])/2)*nx+(cam.wy-(a[1]+b[1])/2)*ny<=0)continue;
    poly([P(a[0],a[1],z0),P(b[0],b[1],z0),P(b[0],b[1],z1),P(a[0],a[1],z1)]);
    g.fillStyle=fill;g.fill();g.strokeStyle=edge;g.globalAlpha=.5;g.lineWidth=1;g.stroke();g.globalAlpha=1;
  }
  poly(pts.map(q=>P(q[0],q[1],z1)));g.fillStyle=top;g.fill();glowStroke(edge,1.5,1);
}
function buildRails(G){
  const out=[],n=G.p.length;
  for(let i=0;i<n;i++){
    const e=G.E[i],o0=G.O[i],o1=G.O[(i+1)%n],cnt=Math.max(1,Math.ceil(e.l/110));
    for(let k=0;k<cnt;k++){
      const u0=k/cnt,u1=(k+1)/cnt,L=(u,a,b)=>a+(b-a)*u;
      const pts=[[L(u0,e.ax,e.bx),L(u0,e.ay,e.by)],[L(u1,e.ax,e.bx),L(u1,e.ay,e.by)],[L(u1,o0[0],o1[0]),L(u1,o0[1],o1[1])],[L(u0,o0[0],o1[0]),L(u0,o0[1],o1[1])]];
      out.push({pts,i,mx:(pts[0][0]+pts[2][0])/2,my:(pts[0][1]+pts[2][1])/2});
    }
  }
  return out;
}
function drawBumper(p,t){
  const h=26+p.hit*8,n=22,sc=1+p.hit*.15,r=p.r*sc;
  for(let i=0;i<n;i++){const a0=i/n*TAU,a1=(i+1)/n*TAU,am=(a0+a1)/2;
    if((cam.wx-(p.x+Math.cos(am)*r))*Math.cos(am)+(cam.wy-(p.y+Math.sin(am)*r))*Math.sin(am)<=0)continue;
    poly([P(p.x+Math.cos(a0)*r,p.y+Math.sin(a0)*r,0),P(p.x+Math.cos(a1)*r,p.y+Math.sin(a1)*r,0),P(p.x+Math.cos(a1)*r,p.y+Math.sin(a1)*r,h),P(p.x+Math.cos(a0)*r,p.y+Math.sin(a0)*r,h)]);
    g.fillStyle=i%2?'#5a0a52':'#7a1166';g.fill();}
  poly(circ(p.x,p.y,r,h,22));g.fillStyle=p.hit>.2?'#fff':'#ff2bd6';g.fill();glowStroke('#ffe14a',1.8,1);
  poly(circ(p.x,p.y,r*.55,h,18));g.strokeStyle='#06021a';g.lineWidth=2;g.stroke();
  poly(circ(p.x,p.y,r*(1.15+.1*Math.sin(t*5)),0,22));g.strokeStyle='#ff2bd6';g.globalAlpha=.4;g.lineWidth=1.2;g.stroke();g.globalAlpha=1;
}
function drawWallPortal(p,i,t){
  const e=S.G.E[p.e],col=WPC[p.col%WPC.length][i%2],a=p.t-p.hw,b=p.t+p.hw,o=1.5;
  const q=(s,z)=>P(e.ax+e.dx*s+e.nx*o,e.ay+e.dy*s+e.ny*o,z);
  poly([q(a,1),q(b,1),q(b,RH),q(a,RH)]);g.fillStyle=col;g.globalAlpha=.28+.12*Math.sin(t*4+i);g.fill();g.globalAlpha=1;glowStroke(col,2.2,1);
  g.strokeStyle=col;g.lineWidth=1.6;
  for(let k=0;k<4;k++){const s=a+((k+(t*1.3*(i%2?-1:1)%1+1)%1)/4)*(b-a);const u=q(s,1),v=q(s,RH);g.globalAlpha=.7;g.beginPath();g.moveTo(u.x,u.y);g.lineTo(v.x,v.y);g.stroke();}
  g.globalAlpha=1;
  const mx=e.ax+e.dx*p.t+e.nx*14,my=e.ay+e.dy*p.t+e.ny*14;poly(circ(mx,my,p.hw*1.0,0,28));g.fillStyle=col;g.globalAlpha=.3;g.fill();g.globalAlpha=.7;glowStroke(col,1.8,1);g.globalAlpha=1;
  g.strokeStyle=col;g.lineWidth=9;g.lineCap='round';line3(e.ax+e.dx*a,e.ay+e.dy*a,RH+1,e.ax+e.dx*b,e.ay+e.dy*b,RH+1);g.lineWidth=2;g.strokeStyle='#fff';g.globalAlpha=.8;line3(e.ax+e.dx*a,e.ay+e.dy*a,RH+1,e.ax+e.dx*b,e.ay+e.dy*b,RH+1);g.globalAlpha=1;
}
function drawPickup(pk,t){
  if(pk.got)return;
  const col=PKN[pk.type][1],z=20+Math.sin(t*3+pk.x)*4,c=P(pk.x,pk.y,z),r=13*c.k,sh=P(pk.x,pk.y,0);
  g.beginPath();g.ellipse(sh.x,sh.y,r*.8,r*.35,0,0,TAU);g.fillStyle=col;g.globalAlpha=.18;g.fill();g.globalAlpha=1;
  g.beginPath();for(let k=0;k<6;k++){const a=k/6*TAU+t*.8;g.lineTo(c.x+Math.cos(a)*r,c.y+Math.sin(a)*r);}g.closePath();
  g.fillStyle='rgba(8,2,30,.75)';g.fill();glowStroke(col,2,1);
  g.strokeStyle=col;g.lineWidth=Math.max(1.5,r*.14);g.lineCap='round';g.lineJoin='round';
  const u=r*.5;
  if(pk.type==='sight'){g.beginPath();g.arc(c.x,c.y,u*.7,0,TAU);g.moveTo(c.x-u*1.2,c.y);g.lineTo(c.x+u*1.2,c.y);g.moveTo(c.x,c.y-u*1.2);g.lineTo(c.x,c.y+u*1.2);g.stroke();}
  else if(pk.type==='magnet'){g.beginPath();g.moveTo(c.x-u,c.y-u);g.lineTo(c.x-u,c.y+u*.2);g.arc(c.x,c.y+u*.2,u,Math.PI,0,true);g.lineTo(c.x+u,c.y-u);g.stroke();}
  else if(pk.type==='brake'){g.beginPath();g.moveTo(c.x-u,c.y);g.lineTo(c.x+u,c.y);g.stroke();}
  else{g.beginPath();g.moveTo(c.x,c.y-u*.8);g.lineTo(c.x-u,c.y);g.lineTo(c.x,c.y+u*.8);g.moveTo(c.x+u,c.y-u*.8);g.lineTo(c.x,c.y);g.lineTo(c.x+u,c.y+u*.8);g.stroke();}
}
function drawMonster(m,t){
  if(!m.alive)return;
  const col=MONC[m.type],R=m.r,bob=Math.sin(m.t*6)*1.5;
  const sh=P(m.x,m.y,0);g.beginPath();g.ellipse(sh.x,sh.y,R*sh.k*1.1,R*sh.k*.5,0,0,TAU);g.fillStyle='#000';g.globalAlpha=.4;g.fill();g.globalAlpha=1;
  if(m.carry){g.setLineDash([4,5]);g.strokeStyle=col;g.globalAlpha=.8;g.lineWidth=2;line3(m.x,m.y,6,m.carry.x,m.carry.y,6);g.setLineDash([]);g.globalAlpha=1;}
  // legs
  g.strokeStyle=col;g.lineWidth=2.2;g.lineCap='round';
  for(let k=0;k<6;k++){const a=k/6*TAU+.3,ph=Math.sin(m.t*9+k*1.7)*3;const u=P(m.x+Math.cos(a)*R*.7,m.y+Math.sin(a)*R*.7,6),v=P(m.x+Math.cos(a)*(R*1.25+ph),m.y+Math.sin(a)*(R*1.25+ph),0);g.beginPath();g.moveTo(u.x,u.y);g.lineTo(v.x,v.y);g.stroke();}
  // body blob
  const body=[];for(let k=0;k<20;k++){const a=k/20*TAU,w=1+.1*Math.sin(m.t*7+k*1.3);body.push(P(m.x+Math.cos(a)*R*w,m.y+Math.sin(a)*R*w,R*.9+bob));}
  poly(body);g.fillStyle='#14062e';g.fill();glowStroke(col,2.4,1);
  const c=P(m.x,m.y,R*1.1+bob),k=c.k;
  // spikes / horns
  g.strokeStyle=col;g.lineWidth=2.4;
  for(const sd of[-1,1]){const u=P(m.x+sd*R*.55*Math.cos(cam.yaw),m.y+sd*R*.55*Math.sin(cam.yaw),R*1.5+bob);g.beginPath();g.moveTo(u.x,u.y);g.lineTo(u.x+sd*5*k,u.y-11*k);g.stroke();}
  // eyes (angry), looking along heading
  const lx=Math.cos(m.face-cam.yaw),ly=Math.sin(m.face-cam.yaw)*.6,er=4.6*k;
  for(const sd of[-1,1]){const ex=c.x+sd*R*.42*k,ey=c.y-R*.05*k;
    g.beginPath();g.arc(ex,ey,er,0,TAU);g.fillStyle='#fff';g.fill();
    g.beginPath();g.arc(ex+lx*er*.5,ey+ly*er*.5,er*.5,0,TAU);g.fillStyle='#14062e';g.fill();
    g.beginPath();g.moveTo(ex-sd*er*1.2,ey-er*1.5+(sd<0?0:0));g.lineTo(ex+sd*er*1.1,ey-er*.6);g.strokeStyle=col;g.lineWidth=2;g.stroke();}
  // jagged mouth
  g.beginPath();const my=c.y+R*.42*k;for(let q=0;q<=4;q++){g.lineTo(c.x+(q-2)*R*.2*k,my+(q%2?2.4:-1)*k);}g.strokeStyle='#fff';g.lineWidth=1.4;g.stroke();
}
function drawMover(m,t){
  const cx=m.x+m.ox,cy=m.y+m.oy;
  prism([[cx-m.hw,cy-m.hh],[cx+m.hw,cy-m.hh],[cx+m.hw,cy+m.hh],[cx-m.hw,cy+m.hh]],0,26,'#3a0a22','#5a1038','#ff2bd6');
}
function drawMill(m,t){
  const hl=m.len/2,ca=Math.cos(m.a),sa=Math.sin(m.a),w=7,nx=-sa*w,ny=ca*w;
  prism([[m.x-ca*hl+nx,m.y-sa*hl+ny],[m.x+ca*hl+nx,m.y+sa*hl+ny],[m.x+ca*hl-nx,m.y+sa*hl-ny],[m.x-ca*hl-nx,m.y-sa*hl-ny]],0,20,'#0c3a4a','#134f66','#19f3ff');
  poly(circ(m.x,m.y,13,24,16));g.fillStyle='#e9f6ff';g.fill();glowStroke('#19f3ff',1.5,1);
}

// ---- characters ----
function eye(x,y,r,lx,ly,mood){
  if(mood==='blink'){g.beginPath();g.moveTo(x-r,y);g.lineTo(x+r,y);g.strokeStyle='#06021a';g.lineWidth=Math.max(1.5,r*.3);g.lineCap='round';g.stroke();return;}
  if(mood==='happy'){g.beginPath();g.arc(x,y+r*.4,r*.9,Math.PI*1.1,Math.PI*1.9);g.strokeStyle='#06021a';g.lineWidth=Math.max(1.5,r*.35);g.lineCap='round';g.stroke();return;}
  if(mood==='ow'){g.beginPath();g.moveTo(x-r*.8,y-r*.8);g.lineTo(x+r*.7,y);g.lineTo(x-r*.8,y+r*.8);g.strokeStyle='#06021a';g.lineWidth=Math.max(1.5,r*.35);g.lineCap='round';g.lineJoin='round';g.stroke();return;}
  g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle='#fff';g.fill();g.lineWidth=1;g.strokeStyle='#06021a';g.stroke();
  g.beginPath();g.arc(x+lx*r*.45,y+ly*r*.45,r*.5,0,TAU);g.fillStyle='#06021a';g.fill();
}
function drawBall(b,t){
  if(b.state==='gone')return;
  const sink=b.state==='sinking',sc=sink?1-b.sT:1;if(sc<.03)return;
  let wx=b.x,wy=b.y;if(sink){const e=ease(b.sT);wx=lerp(b.sx,b.hole.x,e);wy=lerp(b.sy,b.hole.y,e);}
  const zc=BR*(sink?1-b.sT*1.15:1),pc=P(wx,wy,zc),R=BR*pc.k*sc,px=pc.x,py=pc.y,col=BALLC[b.id];
  if(!sink){poly(circ(wx,wy,BR*.95,0,14));g.fillStyle='rgba(0,0,0,.5)';g.fill();}
  const sp=speedOf(b);
  // look direction on screen
  let lw=null;
  if(b.id===0&&S.aim&&S.mode==='aim')lw=[S.aim.dx,S.aim.dy];
  else if(sp>20)lw=[b.vx/sp,b.vy/sp];
  else{const c=S.cue,d=hyp(c.x-b.x,c.y-b.y)||1;lw=[(c.x-b.x)/d,(c.y-b.y)/d];}
  const l2=P(wx+lw[0]*30,wy+lw[1]*30,zc),ld=hyp(l2.x-px,l2.y-py)||1,lx=(l2.x-px)/ld,ly=(l2.y-py)/ld;
  let scared=false;if(b.id>0&&S.cue&&S.cue.state==='live'&&speedOf(S.cue)>200&&hyp(S.cue.x-b.x,S.cue.y-b.y)<150)scared=true;
  const happy=sink||(S.mode==='clear'),ow=b.hit>.05,blink=b.blink<0;
  // motion stretch + body
  g.save();g.translate(px,py);
  if(sp>150){g.rotate(Math.atan2(l2.y-py,l2.x-px));const st=1+Math.min(.18,sp/6000);g.scale(st,1/st);g.rotate(-Math.atan2(l2.y-py,l2.x-px));}
  g.beginPath();g.arc(0,0,R,0,TAU);g.fillStyle=col.c;g.fill();
  g.save();g.clip();g.fillStyle=col.d;g.beginPath();g.arc(-R*.38,-R*.5,R*1.12,0,TAU);g.rect(-R*2,-R*2,R*4,R*4);g.fill('evenodd');g.restore();
  g.beginPath();g.arc(0,0,R,0,TAU);g.strokeStyle='#fff';g.lineWidth=Math.max(1.2,R*.1);g.stroke();
  g.shadowColor=col.c;g.shadowBlur=sink?0:12;g.strokeStyle=col.c;g.globalAlpha=.7;g.lineWidth=1;g.stroke();g.shadowBlur=0;g.globalAlpha=1;
  g.beginPath();g.arc(0,0,R*.74,Math.PI*1.08,Math.PI*1.38);g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=Math.max(1.2,R*.12);g.lineCap='round';g.stroke();
  // accessories
  g.strokeStyle=col.c;g.fillStyle=col.c;g.lineWidth=Math.max(1.5,R*.13);g.lineCap='round';g.lineJoin='round';
  const wob=Math.sin(t*8+b.id);
  if(b.id===0){g.beginPath();g.ellipse(0,-R*1.28,R*.55,R*.16,0,0,TAU);g.strokeStyle='#19f3ff';g.shadowColor='#19f3ff';g.shadowBlur=8;g.stroke();g.shadowBlur=0;}
  else if(b.id===1){g.beginPath();g.moveTo(-R*.1,-R*.95);g.lineTo(R*.25,-R*1.35);g.lineTo(-R*.05,-R*1.35);g.lineTo(R*.3,-R*1.75);g.stroke();}
  else if(b.id===2){for(const s of[-1,1]){g.beginPath();g.moveTo(s*R*.45,-R*.85);g.lineTo(s*R*.7,-R*1.4);g.stroke();g.beginPath();g.arc(s*R*.7,-R*1.45,R*.14,0,TAU);g.fill();}}
  else if(b.id===3){for(const s of[-1,0,1]){g.beginPath();g.moveTo(s*R*.3-R*.14,-R*.92);g.lineTo(s*R*.34,-R*(1.35+(s?0:.25)));g.lineTo(s*R*.3+R*.14,-R*.92);g.closePath();g.fill();}}
  else if(b.id===4){g.beginPath();g.moveTo(-R*.3,-R*.9);g.quadraticCurveTo(-R*.2+wob*R*.1,-R*1.4,R*.02+wob*R*.15,-R*1.75);g.quadraticCurveTo(R*.3,-R*1.3,R*.3,-R*.9);g.closePath();g.fillStyle='#ffe14a';g.fill();}
  else{g.beginPath();g.moveTo(-R*.5,-R*.8);g.lineTo(-R*.3,-R*1.3);g.lineTo(0,-R*.95);g.lineTo(R*.3,-R*1.3);g.lineTo(R*.5,-R*.8);g.stroke();}
  // face
  const fx=lx*R*.22,fy=ly*R*.16-R*.04;
  if(b.id===0){
    const er=R*.42,mood=blink?'blink':happy?'happy':ow?'ow':'';
    if(mood)eye(fx,fy,er,0,0,mood);else{
      g.beginPath();g.arc(fx,fy,er*(scared?1.1:1),0,TAU);g.fillStyle='#fff';g.fill();g.lineWidth=1;g.strokeStyle='#06021a';g.stroke();
      g.beginPath();g.arc(fx+lx*er*.32,fy+ly*er*.32,er*.58,0,TAU);g.fillStyle='#19f3ff';g.fill();
      g.beginPath();g.arc(fx+lx*er*.32,fy+ly*er*.32,er*.28,0,TAU);g.fillStyle='#06021a';g.fill();
    }
    g.beginPath();g.arc(fx,fy+R*.5,R*.2,.15*Math.PI,.85*Math.PI);g.strokeStyle='#06021a';g.lineWidth=Math.max(1.2,R*.1);g.stroke();
  }else{
    const er=R*(scared?.27:.22),mood=blink?'blink':happy?'happy':ow?'ow':scared?'':'';
    for(const s of[-1,1])eye(fx+s*R*.3,fy-R*.05,er,lx,ly,mood);
    g.strokeStyle='#06021a';g.fillStyle='#06021a';g.lineWidth=Math.max(1.2,R*.1);g.beginPath();
    if(happy||ow){g.arc(fx,fy+R*.28,R*.2,0,Math.PI);g.fill();}
    else if(sp>320||scared){g.arc(fx,fy+R*.45,R*.13,0,TAU);g.fill();}
    else g.arc(fx,fy+R*.18,R*.22,.2*Math.PI,.8*Math.PI),g.stroke();
  }
  g.restore();
  if(b.sand&&!sink){g.globalAlpha=.7;g.fillStyle='#ffd36a';for(let i=0;i<3;i++)g.fillRect(px+Math.sin(t*9+i*2)*R,py+R*.9,2,2);g.globalAlpha=1;}
}

// ---- aim overlay ----
function drawStick(A,c,t){
  // cue stick
  const pull=18+A.power*95,bx=c.x-A.dx*(BR+pull),by=c.y-A.dy*(BR+pull),ex=bx-A.dx*110,ey=by-A.dy*110;
  const a=P(bx,by,BR),b=P(ex,ey,BR+4),n=(b.y-a.y)/(hyp(b.x-a.x,b.y-a.y)||1),m=-(b.x-a.x)/(hyp(b.x-a.x,b.y-a.y)||1);
  const w0=3.2*a.k,w1=6.5*b.k,gr=g.createLinearGradient(a.x,a.y,b.x,b.y);gr.addColorStop(0,'#fff');gr.addColorStop(.08,'#ff2bd6');gr.addColorStop(.12,'#2a0a52');gr.addColorStop(1,cueCol(t));
  g.beginPath();g.moveTo(a.x+n*w0,a.y+m*w0);g.lineTo(b.x+n*w1,b.y+m*w1);g.lineTo(b.x-n*w1,b.y-m*w1);g.lineTo(a.x-n*w0,a.y-m*w0);g.closePath();g.fillStyle=gr;g.fill();g.strokeStyle='#e9f6ff';g.lineWidth=1;g.stroke();
}
function drawAim(t){
  const A=S.aim;if(!A||S.mode!=='aim')return;
  const c=S.cue,sight=arm.sight,tr=trace(c.x,c.y,A.dx,A.dy,sight?4:1);
  g.lineCap='round';
  if(S.spin){const pp=previewPath(S.aimA,A.power,S.spin);g.setLineDash([2,9]);g.strokeStyle='#ffe14a';g.lineWidth=3;g.beginPath();pp.pts.forEach((q,i)=>{const s=P(q[0],q[1],3);i?g.lineTo(s.x,s.y):g.moveTo(s.x,s.y);});g.stroke();g.setLineDash([]);
    if(pp.hit){poly(circ(pp.hit.x,pp.hit.y,BR,3,20));glowStroke('#ffffff',1.5,.9);}
    drawStick(A,c,t);return;}
  tr.segs.forEach((s,i)=>{
    const col=s.sup?'#ff7a2b':'#19f3ff';g.setLineDash([2,10]);g.strokeStyle=col;g.lineWidth=3;g.globalAlpha=i?.5:.95;
    const a=P(s.x0,s.y0,3),b=P(s.x1,s.y1,3);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
  });
  g.setLineDash([]);g.globalAlpha=1;
  const h=tr.hit;
  if(h){
    poly(circ(h.x,h.y,BR,3,20));glowStroke('#ffffff',1.5,.9);
    const tx=-h.nx,ty=-h.ny,len=sight?240:110,t2=trace(h.ball.x,h.ball.y,tx,ty,sight?2:0,h.ball);
    g.strokeStyle=BALLC[h.ball.id].c;g.lineWidth=2.5;g.setLineDash([8,6]);
    for(const s of t2.segs){const a=P(s.x0,s.y0,3),b=P(s.x1,s.y1,3);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();if(!sight)break;}
    g.setLineDash([]);
    const dn=h.dx*h.nx+h.dy*h.ny,cx=h.dx-dn*h.nx,cy=h.dy-dn*h.ny,cl=hyp(cx,cy);
    if(cl>.05){g.strokeStyle='#ffffff';g.globalAlpha=.6;g.lineWidth=2;line3(h.x,h.y,3,h.x+cx/cl*60*cl,h.y+cy/cl*60*cl,3);g.globalAlpha=1;}
  }
  drawStick(A,c,t);
  // power ticks
  const pc=P(c.x,c.y,BR),tx=pc.x,ty=pc.y;
  for(let i=0;i<10;i++){const on=A.power>=(i+1)/10,f=i/9,col=f<.5?'#19f3ff':f<.8?'#ffe14a':'#ff2bd6';
    const q=P(c.x+A.dx*(BR+30+i*14),c.y+A.dy*(BR+30+i*14),3);g.fillStyle=col;g.globalAlpha=on?1:.18;g.beginPath();g.arc(q.x,q.y,1.5+on*2,0,TAU);g.fill();}
  g.globalAlpha=1;g.font='700 14px '+getComputedStyle(document.body).getPropertyValue('--disp');g.textAlign='center';g.fillStyle='#fff';g.shadowColor='#19f3ff';g.shadowBlur=8;g.fillText(Math.round(A.power*100)+'%',tx,ty-BR*pc.k*2.6);g.shadowBlur=0;

function drawFX(t,dt){
  for(let i=RINGS.length-1;i>=0;i--){const r=RINGS[i];r.t+=dt;if(r.t>=r.life){RINGS.splice(i,1);continue;}const f=r.t/r.life;poly(circ(r.x,r.y,lerp(r.r0,r.r1,ease(f)),2,24));g.strokeStyle=r.col;g.globalAlpha=(1-f)*.9;g.lineWidth=2;g.stroke();}

  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life-=dt;if(p.life<=0){PT.splice(i,1);continue;}
    p.vz-=900*p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.z<0){p.z=0;p.vz*=-.4;p.vx*=.7;p.vy*=.7;}
    const a=P(p.x,p.y,p.z),b=P(p.x-p.vx*.035,p.y-p.vy*.035,Math.max(0,p.z-p.vz*.035));
    g.strokeStyle=p.col;g.globalAlpha=clamp(p.life/p.max*1.4,0,1);g.lineWidth=Math.max(1,2*a.k);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  // trails
  for(const b of S.balls){if(b.state!=='live')continue;const sp=speedOf(b);if(sp>120&&Math.random()<.9)PT.push({x:b.x,y:b.y,z:BR*.6,vx:0,vy:0,vz:0,life:.28,max:.28,col:b.id?BALLC[b.id].c:cueCol(t),g:0});}
  g.textAlign='center';g.font='700 15px '+getComputedStyle(document.body).getPropertyValue('--disp');
  for(let i=POP.length-1;i>=0;i--){const p=POP[i];p.t+=dt;if(p.t>1.4){POP.splice(i,1);continue;}const q=P(p.x,p.y,30+p.t*60),f=p.t/1.4;
    g.font='700 '+Math.round(p.size*(1+Math.max(0,.4-p.t)*1.2))+'px '+getComputedStyle(document.body).getPropertyValue('--disp');
    g.globalAlpha=1-f*f;g.fillStyle=p.col;g.shadowColor=p.col;g.shadowBlur=10;g.fillText(p.text,q.x,q.y);g.shadowBlur=0;}

}
function render(t,dt){
  g.setTransform(DPR,0,0,DPR,0,0);
  drawBG(t);fit();
  drawFelt(t);drawZones(t);for(const h of S.holes)drawHole(h,t);
  for(const k in S.flash){if(S.flash[k]>0){const e=S.G.E[+k];if(!e)continue;g.globalAlpha=S.flash[k]*.6;g.lineWidth=5;g.strokeStyle=S.L.sup.includes(e.i)?'#ff7a2b':'#19f3ff';line3(e.ax+e.nx*3,e.ay+e.ny*3,2,e.bx+e.nx*3,e.by+e.ny*3,2);g.globalAlpha=1;}}
  drawAim(t);
  const items=[];
  for(const r of S.rails){const sup=S.L.sup.includes(r.i);items.push({d:P(r.mx,r.my,RH/2).d,f:()=>prism(r.pts,-24,RH,sup?'#2d1004':'#150a4a',sup?'#3d1604':'#1d1066',sup?'#ff7a2b':'#19f3ff')});}
  for(const q of S.blocks){items.push({d:P((q.x0+q.x1)/2,(q.y0+q.y1)/2,12).d,f:()=>prism([[q.x0,q.y0],[q.x1,q.y0],[q.x1,q.y1],[q.x0,q.y1]],0,28,'#3a0a4a','#5a1070','#ffe14a')});}
  for(const p of S.bumps)items.push({d:P(p.x,p.y,12).d,f:()=>drawBumper(p,t)});
  S.wp.forEach((p,i)=>{const e=S.G.E[p.e];items.push({d:P(e.ax+e.dx*p.t,e.ay+e.dy*p.t,RH/2).d-8,f:()=>drawWallPortal(p,i,t)});});
  for(const pk of S.picks)if(!pk.got)items.push({d:P(pk.x,pk.y,20).d,f:()=>drawPickup(pk,t)});
  for(const m of S.mons)if(m.alive)items.push({d:P(m.x,m.y,14).d,f:()=>drawMonster(m,t)});
  for(const m of S.movers)items.push({d:P(m.x+m.ox,m.y+m.oy,12).d,f:()=>drawMover(m,t)});
  for(const m of S.mills)items.push({d:P(m.x,m.y,10).d,f:()=>drawMill(m,t)});
  S.pads.forEach((p,i)=>items.push({d:P(p.x,p.y,30).d,f:()=>drawPortal(p,i,t)}));
  for(const h of S.holes)if(h.state!=='gone')items.push({d:P(h.x,h.y,30).d,f:()=>drawFlag(h,t)});
  for(const b of S.balls){if(b.state==='gone')continue;items.push({d:P(b.x,b.y,BR).d,f:()=>drawBall(b,t)});}
  items.sort((a,b)=>b.d-a.d);for(const it of items)it.f();
  drawFX(t,dt);
  if(ds&&ds.live&&S.mode==='aim'){const col=S.power<.5?'#19f3ff':S.power<.8?'#ffe14a':'#ff2bd6';g.lineCap='round';g.setLineDash([]);g.strokeStyle=col;g.globalAlpha=.85;g.lineWidth=3;g.beginPath();g.moveTo(ds.x0,ds.y0);g.lineTo(ds.cx,ds.cy);g.stroke();g.beginPath();g.arc(ds.x0,ds.y0,9,0,TAU);g.stroke();g.beginPath();g.arc(ds.cx,ds.cy,6,0,TAU);g.fillStyle=col;g.fill();g.globalAlpha=1;}
  if(S.flashA>0){g.fillStyle='rgba(255,225,74,'+(S.flashA*.18)+')';g.fillRect(0,0,VW,VH);}
  g.textAlign='center';const fam=getComputedStyle(document.body).getPropertyValue('--disp');
  if(S.msgT>0){g.font='700 '+Math.round(Math.min(26,VW*.065))+'px '+fam;g.globalAlpha=Math.min(1,S.msgT*2);g.fillStyle='#ffe14a';g.shadowColor='#ffe14a';g.shadowBlur=14;g.fillText(S.msg,VW/2,mTop+34);g.shadowBlur=0;g.globalAlpha=1;}
  if(S.tipT>0&&S.tip&&S.mode==='aim'){
    const fs=Math.round(clamp(VW*.03,11,16));g.font=fs+'px '+getComputedStyle(document.body).getPropertyValue('--mono');
    const words=S.tip.split(' '),lines=[];let cur='';for(const w of words){const tt=cur?cur+' '+w:w;if(g.measureText(tt).width>VW-40&&cur){lines.push(cur);cur=w;}else cur=tt;}lines.push(cur);
    g.globalAlpha=Math.min(1,S.tipT)*(.7+.3*Math.sin(t*3));g.fillStyle='#d7ccff';lines.forEach((l,i)=>g.fillText(l,VW/2,mTop+(S.msgT>0?64:16)+i*(fs+4)));g.globalAlpha=1;
  }
}

$('card').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;actx();sfx.ui();
  if(t.id==='goPlay')startRun(Math.min(save.unlocked,99));
  else if(t.dataset.lv)startRun(+t.dataset.lv);
  else if(t.dataset.cue!==undefined){save.cue=+t.dataset.cue;persist();showLocker();}
  else if(t.id==='goDaily')startDaily();
  else if(t.id==='goVs')startVs();
  else if(t.id==='goLocker')showLocker();
  else if(t.id==='goSet')showSettings('title');
  else if(t.id==='goSetP')showSettings('pause');

  else if(t.id==='goRestart'){hide();S.paused=false;if(S.vs){startVs(S.opt&&S.opt.seed);}else{S.score=S.startScore;loadLevel(S.n,S.opt);}}
  else if(t.id==='goMenu'){showTitle();}

const wrapA=a=>{a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI;};

jog.addEventListener('pointerdown',e=>{actx();jogId=e.pointerId;jogX=jogX0=e.clientX;try{jog.setPointerCapture(e.pointerId);}catch(_){}});

const jogEnd=e=>{if(e.pointerId!==jogId)return;jogId=null;jogV=0;jogT.style.transform='translateX(0)';if(S.mode==='aim'){}};
jog.addEventListener('pointerup',jogEnd);jog.addEventListener('pointercancel',jogEnd);
function viewSet(e){const r=view.getBoundingClientRect(),v=clamp((e.clientX-r.left-11)/(r.width-22),0,1);let y=(v-.5)*TAU;for(const s of[0,HP,-HP]){if(Math.abs(y-s)<.09)y=s;}cam.yawT=y;}

view.addEventListener('pointermove',e=>{if(e.pointerId===viewId)viewSet(e);});
const viewEnd=e=>{if(e.pointerId===viewId)viewId=null;};
view.addEventListener('pointerup',viewEnd);view.addEventListener('pointercancel',viewEnd);

function pwSet(e){const r=pw.getBoundingClientRect();S.power=clamp(1-(e.clientY-r.top-6)/(r.height-12),0,1);pwUI();}
pw.addEventListener('pointerdown',e=>{actx();pwId=e.pointerId;try{pw.setPointerCapture(e.pointerId);}catch(_){}pwSet(e);});

// board gestures: pinch zoom + twist rotate, one-finger pan when zoomed, double-tap zoom toggle
const ptrs=new Map();let g2=null,lastTap=0,tapMoved=0,ds=null;
function zoomToggle(){if(cam.zoomT>1.05){cam.zoomT=1;cam.follow=false;}else{cam.zoomT=2.2;cam.follow=true;}}

cv.addEventListener('pointerdown',e=>{if(S.mode==='title'||S.paused)return;actx();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId);}catch(_){}tapMoved=0;
  if(save.ctl&&S.mode==='aim'&&ptrs.size===1)ds={id:e.pointerId,x0:e.clientX,y0:e.clientY,cx:e.clientX,cy:e.clientY,live:false};else ds=null;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];g2={d:hyp(a.x-b.x,a.y-b.y)||1,a:Math.atan2(b.y-a.y,b.x-a.x),z:cam.zoomT,y:cam.yawT};}});

  const dx=e.clientX-p.x,dy=e.clientY-p.y;tapMoved+=Math.abs(dx)+Math.abs(dy);
  if(ds&&ds.id===e.pointerId&&ptrs.size===1&&S.mode==='aim'){
    ds.cx=e.clientX;ds.cy=e.clientY;const vx=ds.cx-ds.x0,vy=ds.cy-ds.y0,len=hyp(vx,vy);
    if(len>14){ds.live=true;const pc=P(S.cue.x,S.cue.y,0),w0=unproj(pc.x,pc.y),w1=unproj(pc.x-vx/len*80,pc.y-vy/len*80);
      S.aimA=Math.atan2(w1.y-w0.y,w1.x-w0.x);S.power=clamp((len-14)/(Math.min(VW,VH)*.4),0,1);pwUI();}
    else{ds.live=false;}
    p.x=e.clientX;p.y=e.clientY;return;}
  if(ptrs.size>=2&&g2){ds=null;p.x=e.clientX;p.y=e.clientY;const[a,b]=[...ptrs.values()];
    const d=hyp(a.x-b.x,a.y-b.y)||1,an=Math.atan2(b.y-a.y,b.x-a.x);
    const nz=clamp(g2.z*d/g2.d,1,3.4);if(g2.z<=1.02&&nz>1.05)cam.follow=true;cam.zoomT=nz;
    cam.yawT=g2.y+wrapA(an-g2.a);tapMoved+=99;return;}
  if(ptrs.size===1&&cam.zoomT>1.05&&!save.ctl){const w0=unproj(p.x,p.y),w1=unproj(e.clientX,e.clientY);cam.fxT=cam.fx+=(w0.x-w1.x);cam.fyT=cam.fy+=(w0.y-w1.y);cam.follow=false;clampFocus();}
  p.x=e.clientX;p.y=e.clientY;});
const cvEnd=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ds&&ds.id===e.pointerId){const go=e.type==='pointerup'&&ds.live&&S.power>.07&&S.mode==='aim';ds=null;if(go){tapMoved=99;doFire();}}else if(ptrs.size===0)ds=null;if(ptrs.size<2)g2=null;
  if(e.type==='pointerup'&&ptrs.size===0&&tapMoved<10){const n=performance.now();if(n-lastTap<320){zoomToggle();lastTap=0;}else lastTap=n;}};
cv.addEventListener('pointerup',cvEnd);cv.addEventListener('pointercancel',cvEnd);
cv.addEventListener('wheel',e=>{if(S.mode==='title')return;e.preventDefault();const nz=clamp(cam.zoomT*Math.exp(-e.deltaY*.0015),1,3.4);if(cam.zoomT<=1.02&&nz>1.05)cam.follow=true;cam.zoomT=nz;},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
$('bZoom').onclick=()=>{zoomToggle();sfx.ui();};
$('bPause').onclick=()=>{if(S.mode==='title')return;sfx.ui();showPause();};
$('bSpin').onclick=()=>{if(S.mode!=='aim')return;S.spin=S.spin===0?-1:S.spin===-1?1:0;sfx.ui();refreshHUD();};
$('bSight').onclick=()=>{arm.sight=!arm.sight;sfx.ui();refreshHUD();};
$('bMagnet').onclick=()=>{arm.magnet=!arm.magnet;sfx.ui();refreshHUD();};
$('bBrake').onclick=()=>{if(S.mode!=='roll'||inv.brake<1)return;inv.brake--;for(const b of S.balls){b.vx=b.vy=0;}S.flashA=.6;sfx.zap();refreshHUD();};
$('bRew').onclick=()=>{if(!S.snap||inv.rewind<1||S.vs)return;inv.rewind--;restore();sfx.tele();};
const keys={};
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key==='ArrowUp'){S.power=clamp(S.power+.05,0,1);pwUI();}else if(e.key==='ArrowDown'){S.power=clamp(S.power-.05,0,1);pwUI();}
  else if(e.key===' '||e.key==='Enter'){if(!$('ov').classList.contains('show'))doFire();}else if(e.key==='m')muted=!muted;
  else if(e.key==='z')zoomToggle();else if(e.key==='p'&&S.mode!=='title')showPause();
});
addEventListener('keyup',e=>{keys[e.key]=false;});
addEventListener('resize',()=>{if(S.mode!=='title'&&S.shots===0)cam.yawT=VW>VH*1.15?HP:0;});
function updateAim(){
  if(S.mode!=='aim'){$('pwM').hidden=true;return;}
  S.aim={dx:Math.cos(S.aimA),dy:Math.sin(S.aimA),power:Math.max(.04,S.power)};
  const c=S.cue,tr=trace(c.x,c.y,S.aim.dx,S.aim.dy,0);
  if(tr.hit&&!S.spin){const d=hyp(tr.hit.x-c.x,tr.hit.y-c.y),v=Math.sqrt(2*260*d*1.15),p=(v-170)/900;
    if(p<.98){const h=pw.clientHeight||132;S.sweet=Math.max(.04,p);$('pwM').hidden=false;$('pwM').style.top=(h-6-S.sweet*(h-12))+'px';}else $('pwM').hidden=true;}
  else $('pwM').hidden=true;
}

// ---- main loop ----
let last=performance.now(),clock=0,acc=0;
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  if(S.paused){render(clock,0);requestAnimationFrame(frame);return;}
  clock+=dt;S.t=clock;
  if(S.mode==='title')cam.yawT+=dt*.22;
  if(S.mode==='aim'){
    let r=((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*.6;
    if(r){const na=S.aimA+r*dt;S.aimA=wrapA(S.aimA+r*dt);}
    if(keys.q)cam.yawT-=dt*1.2;if(keys.e)cam.yawT+=dt*1.2;
  }
  cam.yaw+=(cam.yawT-cam.yaw)*Math.min(1,dt*9);
  cam.pitchT=S.mode==='roll'?.78:.5;
  cam.pitch+=(cam.pitchT-cam.pitch)*Math.min(1,dt*3);
  cam.sx=Math.sin(clock*47)*cam.kick*3;cam.sy=Math.cos(clock*53)*cam.kick*3;
  // slow-mo zoom on last ball
  if(S.slow>0&&S.slowHole&&S.mode==='roll'){if(S.slowZ==null)S.slowZ=cam.zoomT;cam.zoomT=Math.max(S.slowZ,2.2);cam.fxT=S.slowHole.x;cam.fyT=S.slowHole.y;}
  else if(S.slowZ!=null){if(S.mode==='roll')cam.zoomT=S.slowZ;S.slowZ=null;}
  else if(cam.follow&&cam.zoomT>1.02&&S.cue){
    if(S.mode==='roll'){let best=null,bs=40;for(const b of S.balls){if(b.state==='live'){const s2=speedOf(b);if(s2>bs){bs=s2;best=b;}}}if(best){cam.fxT=best.x;cam.fyT=best.y;}}
    else{cam.fxT=S.cue.x;cam.fyT=S.cue.y;}
  }
  cam.zoom+=(cam.zoomT-cam.zoom)*Math.min(1,dt*7);
  const fk=Math.min(1,dt*(S.slow>0?3:6));cam.fx+=(cam.fxT-cam.fx)*fk;cam.fy+=(cam.fyT-cam.fy)*fk;
  if(S.mode==='roll'||S.mode==='clear'||S.mode==='fail'){
    acc+=dt*(S.slow>0?.35:1);let n=0;
    while(acc>=1/120&&n<8){stepPhysics(1/120);acc-=1/120;n++;}
    if(n>=8)acc=0;
    if(S.mode==='roll'){S.rollT+=dt;if(S.rollT>.3&&!isMoving())endShot();else if(S.rollT>30){for(const b of S.balls){b.vx=b.vy=0;}}}
  }else acc=0;
  updateActors(dt);
  camTrig();updateAim();viewUI();
  render(clock,dt);
  requestAnimationFrame(frame);
}
applyCtl();
loadLevel(1);
if(save.unlocked>1)loadLevel(Math.min(save.unlocked,18));
S.mode='title';pwUI();showTitle();
requestAnimationFrame(frame);
})();
</script>
