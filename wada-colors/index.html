:root{--bg:#f6f2ea;--fg:#22201c;--mut:#6f6a61;--card:#fffdf8;--line:#ddd6c8}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.sw{aspect-ratio:1;border-radius:8px;border:1px solid #8884;padding:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.bands{display:flex;min-height:130px}
.band{flex:1;min-width:0;border:0;border-radius:0;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;font-size:12px;overflow-wrap:anywhere}
.foot{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px}
.foot button{font-size:12px;padding:4px 10px}
#sel{scroll-margin-top:8px}
.hero{border-radius:12px;padding:20px;min-height:110px}

function render(){

 else if(cur){const sizes=[...new Set(cur.combos.map(n=>K[n].length))].sort();

  const m=[...new Set(cur.combos.flatMap(n=>K[n]))].filter(c=>c!==cur);

 document.querySelectorAll('#groups .sw').forEach(b=>b.classList.toggle('on',!!cur&&+b.dataset.c===cur.i));
}
function palette(){const q=$('#q').value.trim().toLowerCase();
 const gs=[...new Set(C.map(c=>c.g))].sort();
 $('#groups').innerHTML=gs.map((g,k)=>{const l=C.filter(c=>c.g===g&&(c.name.toLowerCase().includes(q)||c.hex.includes(q)));return l.length?`<h2>Swatch group ${k+1}</h2><div class="grid">${l.map(c=>`<button class="sw" data-c="${c.i}" style="background:${c.hex}" title="${c.name}" aria-label="${c.name}"></button>`).join('')}</div>`:''}).join('')||'<p class="mut">No colors match that search.</p>';
 render()}
const top_=()=>$('#sel').scrollIntoView({behavior:'smooth'});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.c!==undefined){cur=C[+d.c];one=null;size=0;render();top_()}
 else if(d.size!==undefined){size=+d.size;render()}
 else if(d.copy){const done=t=>b.textContent=t;(navigator.clipboard?navigator.clipboard.writeText(d.copy):Promise.reject()).then(()=>done('Copied'),()=>done(d.copy))}
 else if(b.id==='rand'){const k=Object.keys(K);one=+k[Math.random()*k.length|0];cur=null;render();top_()}
 else if(b.id==='clear'){cur=one=null;$('#q').value='';palette();scrollTo({top:0,behavior:'smooth'})}});

palette();
