<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stick Brawl Deluxe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* Layout: a tiny menu (fighter tiles, Fight, Story, Options) and a fullscreen game screen
   with touch controls over the canvas. Look: 1980 vector arcade, single dark theme by choice. */
:root{
  --bg:#05060a; --panel:#0a1119; --ink:#d9f3ff; --dim:#6f8ea3; --line:#15303f;
  --cyan:#39e6ff; --pink:#ff4fa3; --amber:#ffd23f;
  --display:'Major Mono Display','Share Tech Mono',ui-monospace,monospace;
  --body:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--body);padding-block:18px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#menu{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:400 clamp(24px,7vw,40px)/1.05 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--cyan);text-shadow:0 0 14px rgba(57,230,255,.55)}
#tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tile canvas{width:100%;aspect-ratio:4/5;display:block}
.tile span{font-size:12px;letter-spacing:.1em;color:var(--c)}
.tile[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 14px -3px var(--c)}
.go{display:flex;gap:10px}
.big{flex:1;font-size:18px;letter-spacing:.16em;text-transform:uppercase;padding:14px 10px;background:transparent;border:2px solid var(--cyan);color:var(--cyan)}
.big:hover,.big:active{background:var(--cyan);color:var(--bg)}
.big.alt{border-color:var(--pink);color:var(--pink)}
.big.alt:hover,.big.alt:active{background:var(--pink);color:var(--bg)}
.gear{align-self:flex-start;background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#opts{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:14px}
#opts>label,#opts>span{color:var(--dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);width:fit-content;max-width:100%}
.seg button{background:transparent;border:0;border-right:1px solid var(--line);padding:6px 10px;font-size:13px;color:var(--dim)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--cyan);color:var(--bg)}
select{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:6px 8px;font-size:13px;max-width:100%}
#game{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:5;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;max-height:100dvh;background:var(--bg);touch-action:none}
.pz{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));width:40px;height:40px;background:rgba(10,17,25,.5);border:1px solid rgba(57,230,255,.45);color:var(--ink);border-radius:50%;font-size:14px;letter-spacing:0;padding:0}
.touch{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (pointer:coarse){.touch{display:flex}}
.touch .pad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,62px);gap:6px}
.touch .acts{display:grid;grid-template-columns:repeat(2,70px);gap:8px}
.touch button{pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0;border-radius:50%;background:rgba(10,17,25,.5);border:2px solid rgba(57,230,255,.5);color:var(--ink);font-size:20px;height:62px}
.touch button.on{background:rgba(57,230,255,.55);color:var(--bg)}
.touch .u{grid-column:2}.touch .l{grid-column:1;grid-row:2}.touch .b{grid-column:2;grid-row:2}.touch .r{grid-column:3;grid-row:2}
.touch .acts button{height:70px;font-size:22px;letter-spacing:0}
.touch .acts .s{grid-column:1 / span 2;height:46px;border-radius:30px;border-color:rgba(255,210,63,.7);color:var(--amber);font-size:16px}
#after{position:absolute;left:0;right:0;bottom:12%;display:flex;gap:12px;justify-content:center;padding:0 16px}
#after .big{flex:0 1 190px;background:rgba(5,6,10,.8)}
#pause{position:absolute;inset:0;background:rgba(5,6,10,.92);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:16px}
#pause .big{flex:none;width:min(260px,80vw)}
#pause p{margin:8px 0 0;color:var(--dim);font-size:12px;text-align:center;max-width:46ch}
@media (pointer:coarse){#pause p{display:none}}
#rot{position:absolute;inset:0;background:rgba(5,6,10,.94);display:none;align-items:center;justify-content:center;font:400 22px/1.2 var(--display);color:var(--pink);text-transform:uppercase;text-align:center;padding:24px}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
#rot.gone{display:none!important}
</style>

<div id="menu">
  <h1>Stick Brawl</h1>
  <div id="tiles" role="group" aria-label="Choose fighter"></div>
  <div class="go"><button class="big" id="bFight" type="button">Fight</button><button class="big alt" id="bStory" type="button">Story</button></div>
  <button class="gear" id="bOpt" type="button" aria-expanded="false" aria-controls="opts">Options</button>
  <div id="opts" hidden>
    <label for="oppSel">Opponent</label><select id="oppSel"></select>
    <label for="stgSel">Stage</label><select id="stgSel"></select>
    <span>2nd player</span><div class="seg" id="sP2"></div>
    <span>Blood</span><div class="seg" id="sBlood"></div>
    <span>Jiggle</span><div class="seg" id="sJig"></div>
    <span>Body</span><div class="seg" id="sBody"></div>
    <label for="hairSel">Hair</label><select id="hairSel"></select>
  </div>
</div>

<div id="game" hidden>
  <canvas id="cv" role="img" aria-label="Stick figure fighting game"></canvas>
  <button class="pz" id="bPause" type="button" aria-label="Pause">II</button>
  <div class="touch" id="touch">
    <div class="pad"><button class="u" data-k="u" aria-label="Jump">&#9650;</button><button class="l" data-k="l" aria-label="Left">&#9664;</button><button class="b" data-k="b" aria-label="Block">B</button><button class="r" data-k="r" aria-label="Right">&#9654;</button></div>
    <div class="acts"><button class="s" data-k="s" aria-label="Special">&#9733;</button><button data-k="k" aria-label="Kick">K</button><button data-k="p" aria-label="Punch">P</button></div>
  </div>
  <div id="after" hidden><button class="big" id="aPri" type="button">Again</button><button class="big alt" id="aMenu" type="button">Menu</button></div>
  <div id="pause" hidden>
    <button class="big" id="pResume" type="button">Resume</button>
    <button class="big" id="pAgain" type="button">Restart</button>
    <button class="big alt" id="pMenu" type="button">Menu</button>
    <p>P1: A D move, W jump, S block, F punch, G kick, H special. P2: arrows, comma, period, slash.</p>
  </div>
  <div id="rot">Rotate your phone</div>
</div>
<script>
(function(){
'use strict';
var DEG=Math.PI/180, W=800, H=450, GY=372;
var clamp=function(v,a,b){return v<a?a:v>b?b:v;};
var rnd=function(a,b){return a+Math.random()*(b-a);};
var JIGMUL={off:0,norm:1,absurd:2.6};
var jigLevel='norm', bloodLevel='on';
var HAIRS=[['none','Bald'],['bob','Bob'],['pony','Ponytail'],['long','Long'],['pigtails','Pigtails'],['bun','Top bun'],['buzz','Buzz cut'],['mohawk','Mohawk'],['afro','Afro'],['spiky','Spiky'],['comb','Combover']];

var CH=[
 {id:'karen',g:'F',alt:'KYLE',name:'KAREN',title:'Laid-off Regional Manager',debt:'Fighting for: rent ($1,850)',tag:'I want to speak to your manager.',sp:'Speak to Manager',col:'#ff4fa3',s:1,hp:100,spd:155,jmp:560,hair:'bob'},
 {id:'chad',g:'M',alt:'CHANTELLE',name:'CHAD',title:'Gym Bro, Gym Closed',debt:'Fighting for: protein powder ($89/mo)',tag:'Bro. Do you even lift?',sp:'Protein Shake',col:'#39e6ff',s:1.06,hp:115,spd:130,jmp:520,hair:'buzz',chestR:4.8,chestK:620},
 {id:'brit',g:'F',alt:'BRAYDEN',name:'BRITTANI',title:'Deplatformed Influencer',debt:'Fighting for: ring light payments',tag:'Like, comment, and block.',sp:'Selfie Flash',col:'#ffd23f',s:.98,hp:90,spd:175,jmp:600,hair:'pony'},
 {id:'hodl',g:'M',alt:'HOLLY',name:'HODL',title:'Crypto Bro, Down 94%',debt:'Fighting for: 3 months back rent',tag:'This is not financial advice.',sp:'Rug Pull',col:'#76ff5a',s:1,hp:95,spd:160,jmp:580,hair:'mohawk',ex:[{t:.7,nn:4,r:4,k:240,d:4.5,kind:'coin'}]},
 {id:'dan',g:'M',alt:'MOM DEB',name:'DAD DAN',title:'Grill Dad, Medical Debt',debt:'Fighting for: one ER visit ($48,212)',tag:"Hi Hungry, I'm Dad.",sp:'Dad Joke',col:'#ff9330',s:1.04,hp:130,spd:105,jmp:470,hair:'comb',ex:[{t:.34,nn:7,r:8.5,k:170,d:4,kind:'belly'}]},
 {id:'dave',g:'M',alt:'DANA',name:'DAVE',title:'Ex-CEO, Startup Folded',debt:'Fighting for: ramen',tag:"We're a family. A lean family.",sp:'Layoffs',col:'#b58cff',s:1,hp:100,spd:150,jmp:550,hair:'spiky',ex:[{t:.62,nn:3.5,r:3.2,k:200,d:3.5,kind:'badge'}]}
];
var IDLE=[-16,-8,14,6,25,135,40,145,6];

function spotsFor(c,body,hair){
  var o=[];
  if(body==='F'){o.push({t:.8,nn:5,r:5.5,k:340,d:6.5,kind:'c'},{t:.7,nn:2,r:5.5,k:290,d:6,kind:'c'});}
  else{var r=c.chestR||3.8,k=c.chestK||600;o.push({t:.82,nn:4,r:r,k:k,d:10,kind:'c'},{t:.74,nn:2.2,r:r,k:k*.92,d:9,kind:'c'});}
  if(c.ex)c.ex.forEach(function(e){o.push(e);});
  if(hair==='pony')o.push({head:true,ax:.8,ay:.2,k:90,d:3.5,kind:'tail',len:14});
  else if(hair==='long')o.push({head:true,ax:.6,ay:.1,k:70,d:3,kind:'tail',len:22});
  else if(hair==='pigtails')o.push({head:true,ax:.7,ay:.5,k:100,d:3.5,kind:'tail',len:12},{head:true,ax:.7,ay:-.2,k:90,d:3.2,kind:'tail',len:12});
  else if(hair==='bun')o.push({head:true,ax:0,ay:1.15,k:200,d:5,kind:'bun',len:4});
  return o;
}

function mk(ci,side,human,look){
  var c=CH[ci];look=look||{};
  var body=look.body||c.g,hair=look.hair||c.hair,sp=spotsFor(c,body,hair);
  return {c:c,body:body,hair:hair,name:body===c.g?c.name:c.alt,s:c.s*(body==='M'?1.03:.97),side:side,human:human,
    x:side<0?250:550,y:GY,vx:0,vy:0,face:side<0?1:-1,hp:c.hp,max:c.hp,mt:0,state:'idle',st:0,stun:0,clock:Math.random()*6,walkT:0,
    ang:IDLE.slice(),rot:0,hitDone:false,spDone:false,wins:0,opp:null,sk:null,wep:null,spots:sp,
    jig:sp.map(function(){return {ox:0,oy:0,vx:0,vy:0,init:false,pbx:0,pby:0,pvx:0,pvy:0,b:[0,0]};}),
    inp:{l:0,r:0,u:0,blk:0},q:{p:0,k:0,s:0},ai:{t:0,act:'idle'}};
}

function target(f){
  var c=f.clock,e;
  switch(f.state){
    case 'walk':{var p=f.walkT,a=Math.sin(p)*34,b=-a;
      return [a,a-Math.max(0,Math.sin(p+1.4))*26,b,b-Math.max(0,Math.sin(p+Math.PI+1.4))*26,25-a*.4,135,40+a*.3,145,8];}
    case 'jump': return [-30,-75,55,12,85,125,105,140,8];
    case 'block': return [30,-25,42,-14,75,172,85,176,-4];
    case 'hit': return [-10,-5,12,6,125,100,105,90,-26];
    case 'ko': return [12,6,-12,-6,110,70,125,60,-6];
    case 'win':{var w=Math.sin(c*9)*10;return [-10,-5,10,5,165+w,175,172-w,178,0];}
    case 'punch': e=Math.sin(Math.min(1,f.st/.32)*Math.PI);
      return [-16-8*e,-8,14+16*e,6+10*e,25,135,40+52*e,145-55*e,6+14*e];
    case 'kick': e=Math.sin(Math.min(1,f.st/.46)*Math.PI);
      return [-8,-10,10+78*e,6+84*e,40+30*e,120,55+20*e,130,6-20*e];
    case 'special': e=Math.sin(Math.min(1,f.st/.55)*Math.PI);
      return [-16,-8,14,6,35+60*e,140-50*e,45+55*e,145-55*e,6+8*e];
  }
  var t=IDLE.slice();t[4]+=Math.sin(c*5)*3;t[6]+=Math.sin(c*5+1)*3;t[8]+=Math.sin(c*5)*1.5;t[2]+=Math.sin(c*5)*1.5;return t;
}
function poseUpdate(f,dt){
  var tg=target(f),atk=(f.state==='punch'||f.state==='kick'||f.state==='special'||f.state==='hit');
  var k=1-Math.exp(-dt*(atk?34:22));
  for(var i=0;i<9;i++)f.ang[i]+=(tg[i]-f.ang[i])*k;
  var rt=f.state==='ko'?-f.face*Math.PI/2*.96:0;
  f.rot+=(rt-f.rot)*(1-Math.exp(-dt*(f.state==='ko'?7:14)));
}

function skel(f){
  var s=f.s,fc=f.face,A=f.ang,TH=23*s,SH=22*s,TO=34*s,UA=18*s,FA=19*s,HR=9*s,NK=4*s;
  var d=function(a,l){return [Math.sin(a*DEG)*fc*l,Math.cos(a*DEG)*l];};
  var extL=TH*Math.cos(A[0]*DEG)+SH*Math.cos(A[1]*DEG),extR=TH*Math.cos(A[2]*DEG)+SH*Math.cos(A[3]*DEG);
  var hip=[f.x,f.y-Math.max(extL,extR)];
  var l=A[8]*DEG,u=[Math.sin(l)*fc,-Math.cos(l)],n=[Math.cos(l)*fc,Math.sin(l)];
  var sh=[hip[0]+u[0]*TO,hip[1]+u[1]*TO],nt=[sh[0]+u[0]*NK,sh[1]+u[1]*NK],head=[nt[0]+u[0]*HR,nt[1]+u[1]*HR];
  var limb=function(o,a1,l1,a2,l2){var m=d(a1,l1),j=[o[0]+m[0],o[1]+m[1]],e=d(a2,l2);return [o,j,[j[0]+e[0],j[1]+e[1]]];};
  var foot=function(sa,an){var m=d(sa+90,7*s);return [an,[an[0]+m[0],an[1]+m[1]]];};
  var lk=limb(hip,A[0],TH,A[1],SH),rk=limb(hip,A[2],TH,A[3],SH);
  return {hip:hip,sh:sh,nt:nt,head:head,u:u,n:n,HR:HR,TO:TO,s:s,lk:lk,rk:rk,la:limb(sh,A[4],UA,A[5],FA),ra:limb(sh,A[6],UA,A[7],FA),lf:foot(A[1],lk[2]),rf:foot(A[3],rk[2])};
}

function jigStep(f,dt){
  if(dt<=0)return;
  var sk=f.sk,gain=JIGMUL[jigLevel],fc=f.face;
  f.jig.forEach(function(j,i){
    var sp=f.spots[i],b;
    if(sp.head)b=[sk.head[0]-fc*sk.HR*sp.ax,sk.head[1]-sk.HR*sp.ay];
    else b=[sk.hip[0]+sk.u[0]*sk.TO*sp.t+sk.n[0]*sp.nn*sk.s,sk.hip[1]+sk.u[1]*sk.TO*sp.t+sk.n[1]*sp.nn*sk.s];
    j.b=b;
    if(!j.init){j.pbx=b[0];j.pby=b[1];j.pvx=0;j.pvy=0;j.init=true;return;}
    var vx=(b[0]-j.pbx)/dt,vy=(b[1]-j.pby)/dt;
    var ax=clamp((vx-j.pvx)/dt,-9000,9000),ay=clamp((vy-j.pvy)/dt,-9000,9000);
    j.pbx=b[0];j.pby=b[1];j.pvx=vx;j.pvy=vy;
    var h=dt/2;
    for(var k=0;k<2;k++){j.vx+=(-sp.k*j.ox-sp.d*j.vx-ax*gain)*h;j.vy+=(-sp.k*j.oy-sp.d*j.vy-ay*gain)*h;j.ox+=j.vx*h;j.oy+=j.vy*h;}
    var lim=9*f.s*(sp.kind==='belly'?1.5:1),m=Math.hypot(j.ox,j.oy);
    if(m>lim){j.ox*=lim/m;j.oy*=lim/m;}
    if(gain===0){j.ox=j.oy=j.vx=j.vy=0;}
  });
}

function pl(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.stroke();}
function ln(g,x1,y1,x2,y2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
function dot(g,x,y,r,fill){g.beginPath();g.arc(x,y,r,0,6.2832);if(fill)g.fill();g.stroke();}

function hairFront(g,f,h,HR,fc){
  var st=f.hair,x=h[0],y=h[1],i;g.lineWidth=2.3;
  if(st==='bob')pl(g,[[x+fc*HR*.85,y-HR*.7],[x,y-HR-1.8],[x-fc*(HR+1.5),y-HR*.4],[x-fc*(HR+2),y+HR*.9]]);
  else if(st==='long'||st==='pony'||st==='pigtails'||st==='bun')pl(g,[[x+fc*HR*.85,y-HR*.7],[x,y-HR-1.7],[x-fc*(HR+1.2),y-HR*.25]]);
  else if(st==='buzz'){g.lineWidth=1.6;g.beginPath();g.arc(x,y,HR+1.3,Math.PI*1.08,Math.PI*1.92);g.stroke();}
  else if(st==='mohawk'){for(i=0;i<4;i++){var dx=(i-1.5)*HR*.5,py=y-Math.sqrt(Math.max(0,HR*HR-dx*dx));ln(g,x+dx,py,x+dx+fc*(i-1.5)*1.4,py-7-(i%2)*3);}}
  else if(st==='spiky'){for(i=0;i<5;i++){var a=Math.PI*(1.1+i*.2);ln(g,x+Math.cos(a)*HR,y+Math.sin(a)*HR,x+Math.cos(a)*(HR+7),y+Math.sin(a)*(HR+7));}}
  else if(st==='comb'){g.beginPath();g.arc(x,y,HR+1,Math.PI*1.08,Math.PI*1.92);g.stroke();pl(g,[[x-fc*HR*.7,y-HR*.55],[x,y-HR*.92],[x+fc*HR*.6,y-HR*.8]]);}
}

function drawWeapon(g,f){
  var w=f.wep;if(!w)return;
  var hd=f.sk.ra[2],e=f.sk.ra[1],dx=hd[0]-e[0],dy=hd[1]-e[1],m=Math.hypot(dx,dy)||1,vx=dx/m,vy=dy/m,s=f.s;
  g.save();g.shadowColor='#ffe9a8';g.shadowBlur=6;g.strokeStyle='#ffe9a8';g.fillStyle='#05060a';g.lineCap='round';
  if(w.type==='bat'){g.lineWidth=5.5;ln(g,hd[0]-vx*4,hd[1]-vy*4,hd[0]+vx*28*s,hd[1]+vy*28*s);}
  else if(w.type==='pan'){g.lineWidth=3;ln(g,hd[0],hd[1],hd[0]+vx*12*s,hd[1]+vy*12*s);dot(g,hd[0]+vx*20*s,hd[1]+vy*20*s,8*s,true);}
  else{g.strokeStyle='#8cf';g.shadowColor='#8cf';g.lineWidth=6;ln(g,hd[0],hd[1],hd[0]+vx*10*s,hd[1]+vy*10*s);g.lineWidth=1.5;
    for(var i=0;i<3;i++)ln(g,hd[0]+vx*12*s,hd[1]+vy*12*s,hd[0]+vx*(16+rnd(0,6))*s+rnd(-4,4),hd[1]+vy*(16+rnd(0,6))*s+rnd(-4,4));}
  g.restore();
}

function drawF(g,f){
  var sk=f.sk,c=f.c,col=c.col,fc=f.face,s=f.s,h=sk.head,HR=sk.HR;
  g.save();
  if(f.rot){g.translate(f.x,f.y);g.rotate(f.rot);g.translate(-f.x,-f.y);}
  g.strokeStyle=col;g.fillStyle='#05060a';g.lineWidth=f.body==='M'?3.7:3.1;g.lineCap='round';g.lineJoin='round';
  g.shadowColor=col;g.shadowBlur=9;
  if(f.hair==='afro'){g.lineWidth=2.4;dot(g,h[0]-fc*1.5,h[1]-3,HR+6.5,true);g.lineWidth=f.body==='M'?3.7:3.1;}

function stepF(f,o,dt){
  f.clock+=dt;f.st+=dt;
  var grounded=f.y>=GY-.5&&f.vy>=0,live=G.phase==='fight';
  if(canAct(f)&&grounded){var nf=o.x>=f.x?1:-1;if(nf!==f.face){f.face=nf;f.jig.forEach(function(j){j.init=false;});}}
  f.mt=Math.min(100,f.mt+4*dt);
  f.q.p-=dt;f.q.k-=dt;f.q.s-=dt;
  if(f.state==='ko'||f.state==='win'){f.vx*=Math.pow(.02,dt);}
  else if(f.state==='hit'){f.vx*=Math.pow(.03,dt);if(f.st>=f.stun)setS(f,grounded?'idle':'jump');}
  else if(f.state==='punch'||f.state==='kick'||f.state==='special'){
    var dur=f.state==='punch'?.32:f.state==='kick'?.46:.55;
    f.vx*=Math.pow(.05,dt);
    if(f.state==='special'&&!f.spDone&&f.st>=.22){f.spDone=true;special(f,o);}
    if(f.state==='punch'&&f.wep&&f.wep.type==='taser'&&!f.spDone&&f.st>=.1){
      f.spDone=true;sfx('zap');G.proj.push({type:'zap',owner:f,t:0,life:.7,dir:f.face,vx:560*f.face,vy:0,g:0,dmg:7,stun:.45,x:f.x+f.face*30,y:f.y-62*f.s,w:26,h:12});
      f.wep.uses--;if(f.wep.uses<=0){label(f.x,f.y-125*f.s,'TASER DEAD','#8cf',12);f.wep=null;}
    }
    if(f.st>=dur)setS(f,grounded?'idle':'jump');
  }
  if(canAct(f)){
    if(live){
      var i=f.inp,mv=(i.r?1:0)-(i.l?1:0);
      if(i.blk&&grounded){setS(f,'block');f.vx=0;}
      else{
        f.vx=mv*f.c.spd*(grounded?1:.8)*((mv*f.face<0)?.85:1);
        if(mv!==0&&grounded){setS(f,'walk');f.walkT+=dt*10;}else if(grounded)setS(f,'idle');
        if(i.u&&grounded){f.vy=-f.c.jmp;setS(f,'jump');}else if(!grounded)setS(f,'jump');
        if(f.q.p>0)startAtk(f,'punch');else if(f.q.k>0)startAtk(f,'kick');else if(f.q.s>0&&f.mt>=40)startAtk(f,'special');
      }
    }else{f.vx=0;if(grounded)setS(f,'idle');}
  }

function startGame(m){
  mode=m;G.mode=m;G.paused=false;A=mk(sel,-1,true,look);G.p2=false;
  if(m==='story'){G.ch=0;B=mk(STORY[sel].opps[0],1,false,null);G.level=0;A.opp=B;B.opp=A;G.viewers=1200000;chapterSetup();}
  else{
    var oi=oppSel>=0?oppSel:((sel+1+((Math.random()*5)|0))%6);
    G.p2=p2on;B=mk(oi,1,p2on,null);G.level=stageSel>=0?stageSel:((Math.random()*4)|0);
    A.opp=B;B.opp=A;G.round=1;G.viewers=1200000;startRound();
  }
  hideAfter();menuEl.hidden=true;gameEl.hidden=false;document.documentElement.style.overflow='hidden';
}
function advance(){
  if(G.paused)return;
  if(G.phase==='story'){
    var c=G.card;if(Math.floor(G.pt*55)<c.text.length){G.pt=999;return;}
    if(c.end){G.phase='over';showAfter('Again',function(){startGame('story');});}else startRound();
  }else if(G.phase==='replay')startVictory();
  else if(G.phase==='victory')afterVictory();
}
function retry(){A.wins=B.wins=0;G.round=1;hideAfter();startRound();}
function afterVictory(){
  var w=G.vw;
  if(G.mode==='story'&&w===A){
    if(G.ch<3){G.ch++;chapterSetup();}
    else{G.phase='story';G.pt=0;G.card={head:'THE END',title:'',col:'#ff4fa3',vs:'',text:STORY[sel].end.split('{n}').join(A.name),end:true};}
  }else{G.phase='over';showAfter(G.mode==='story'?'Retry':'Again',retry);}
}

/* ---------- replay and victory ---------- */
function snapF(f){return {x:f.x,y:f.y,face:f.face,rot:f.rot,ang:f.ang.slice(),state:f.state,wep:f.wep?f.wep.type:null,jig:f.jig.map(function(j){return [j.ox,j.oy,j.b[0],j.b[1]];})};}
function record(){
  REC.push({n:recN++,t:simT,a:snapF(A),b:snapF(B),
    proj:G.proj.map(function(p){return Object.assign({},p);}),
    fx:G.fx.map(function(p){return {k:p.k,x:p.x,y:p.y,vx:p.vx,vy:p.vy,r:p.r,col:p.col,text:p.text,size:p.size,life:p.life,t:p.t};})});
  if(REC.length>320)REC.shift();
}
function proxy(f){var p=Object.assign({},f);p.jig=f.jig.map(function(){return {ox:0,oy:0,b:[0,0]};});return p;}
function applySnap(p,s){
  p.x=s.x;p.y=s.y;p.face=s.face;p.rot=s.rot;p.ang=s.ang;p.state=s.state;p.wep=s.wep?{type:s.wep}:null;
  s.jig.forEach(function(j,i){p.jig[i].ox=j[0];p.jig[i].oy=j[1];p.jig[i].b=[j[2],j[3]];});p.sk=skel(p);
}
function startReplay(){
  var koN=G.koN,frames=REC.filter(function(r){return r.n>=koN-110&&r.n<=koN+45;});
  if(frames.length<12){startVictory();return;}
  G.rp={frames:frames,tp:frames[0].t,end:frames[frames.length-1].t,i:0,pa:proxy(A),pb:proxy(B),lose:A.state==='ko'?'a':'b',fa:null,fb:null,fp:[],fx:[]};
  G.phase='replay';G.pt=0;replayStep(0);
  var v=G.rp.lose==='a'?G.rp.pa:G.rp.pb;G.cam.x=v.x;G.cam.y=v.y-62;G.cam.z=1.5;
}
function replayStep(rdt){
  var r=G.rp;r.tp+=rdt*.28;
  while(r.i<r.frames.length-1&&r.frames[r.i+1].t<=r.tp)r.i++;
  var fr=r.frames[r.i];applySnap(r.pa,fr.a);applySnap(r.pb,fr.b);r.fa=r.pa;r.fb=r.pb;r.fp=fr.proj;r.fx=fr.fx;
  var v=r.lose==='a'?r.pa:r.pb,k=Math.min(1,rdt*3.5);
  G.cam.x+=(v.x-G.cam.x)*k;G.cam.y+=((v.y-62)-G.cam.y)*k;G.cam.z+=(2.4-G.cam.z)*Math.min(1,rdt*1.2);
  if(r.tp>=r.end+.3||G.pt>7)startVictory();
}
function startVictory(){
  var w=A.state==='win'?A:B;G.vw=w;G.phase='victory';G.vt=0;G.conf=[];G.sub=KO_SUB[(Math.random()*KO_SUB.length)|0];G.excite=1;
  G.cam.x=w.x;G.cam.y=w.y-62;G.cam.z=1.1;
}
function stepConf(dt){
  if(G.phase==='victory'&&G.vt>.4&&G.conf.length<90){for(var i=0;i<2;i++)G.conf.push({x:rnd(0,W),y:-10,vx:rnd(-20,20),vy:rnd(40,110),r:rnd(0,6),vr:rnd(-3,3),w:rnd(5,9),h:rnd(3,5),col:Math.random()<.5?'#ffd23f':(Math.random()<.5?'#ff4fa3':'#39e6ff'),tx:Math.random()<.18});}
  G.conf.forEach(function(c){c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=c.vr*dt;});
  G.conf=G.conf.filter(function(c){return c.y<H+20;});
}

/* ---------- update ---------- */
function update(dt,rdt){
  G.shake*=Math.pow(.004,rdt);G.excite=Math.max(0,G.excite-rdt*.2);
  var cin=(G.phase==='replay'||G.phase==='victory');
  G.bar+=((cin?1:0)-G.bar)*Math.min(1,rdt*4);
  if(!cin){var kz=Math.min(1,rdt*5);G.cam.z+=(1-G.cam.z)*kz;G.cam.x+=(W/2-G.cam.x)*kz;G.cam.y+=(H/2-G.cam.y)*kz;}
  if(G.phase==='replay'){G.pt+=rdt;replayStep(rdt);return;}
  if(G.freeze>0){G.freeze-=dt;return;}
  G.pt+=rdt;G.viewers+=dt*6000;simT+=dt;
  if(G.phase==='victory'){
    G.vt+=rdt;var w=G.vw,kk=Math.min(1,rdt*3);
    G.cam.x+=(w.x-G.cam.x)*kk;G.cam.y+=((w.y-62*w.s)-G.cam.y)*kk;G.cam.z=1.15+1.65*Math.min(1,G.vt/4.2);
    stepConf(dt);if(G.vt>=5.8)afterVictory();
  }
  if(G.phase==='intro'&&G.pt>=1.9){G.phase='fight';G.pt=0;}
  if(G.phase==='fight'){
    G.time-=dt;readInput(A,0);
    if(B.human)readInput(B,1);else aiStep(B,A,dt);
    G.pickT-=dt;if(G.pickT<=0&&G.pick.length<1){spawnPick();G.pickT=rnd(7,11);}
  }
  stepF(A,B,dt);stepF(B,A,dt);
  var dx=B.x-A.x;
  if(Math.abs(dx)<32&&Math.abs(A.y-B.y)<50&&A.state!=='ko'&&B.state!=='ko'){
    var pu=(32-Math.abs(dx))/2,sg=dx>=0?1:-1;A.x=clamp(A.x-sg*pu,28,W-28);B.x=clamp(B.x+sg*pu,28,W-28);
  }
  [A,B].forEach(function(f){poseUpdate(f,dt);f.sk=skel(f);});
  if(G.phase==='fight'){tryHit(A,B);tryHit(B,A);}
  G.pick.forEach(function(p){
    p.t+=dt;if(p.y<GY){p.vy=Math.min(120,p.vy+300*dt);p.y=Math.min(GY,p.y+p.vy*dt);}
    if(G.phase==='fight'&&p.y>=GY-8)[A,B].forEach(function(f){if(!p.dead&&f.state!=='ko'&&f.state!=='hit'&&Math.abs(f.x-p.x)<26&&f.y>GY-40)collect(f,p);});
  });
  G.pick=G.pick.filter(function(p){return !p.dead;});
  G.proj.forEach(function(p){projStep(p,dt);});
  G.proj=G.proj.filter(function(p){return !p.dead;});
  [A,B].forEach(function(f){jigStep(f,dt);});
  G.fx.forEach(function(p){
    p.t+=dt;if(p.k==='b'){p.vy+=900*dt;if(p.y>=GY+2){p.t=p.life;if(G.decals.length<240)G.decals.push({x:p.x,y:GY+rnd(2,36),r:p.r*rnd(1.3,2.8)});}}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
  });
  G.fx=G.fx.filter(function(p){return p.t<p.life;});
  if(G.phase==='fight'||G.phase==='ko')record();
  if(G.phase==='fight'){
    if(A.hp<=0&&B.hp<=0)endRound(null,null);
    else if(A.hp<=0)endRound(B,A);
    else if(B.hp<=0)endRound(A,B);
    else if(G.time<=0){G.time=0;if(A.hp>B.hp)endRound(A,B);else if(B.hp>A.hp)endRound(B,A);else endRound(null,null);}
  }else if(G.phase==='ko'&&G.pt>=(G.final?1.6:2.6)){
    if(G.final)startReplay();else{G.round++;startRound();}
  }
}

/* ---------- input ---------- */
var KM=[{l:['KeyA'],r:['KeyD'],u:['KeyW'],b:['KeyS'],p:['KeyF'],k:['KeyG'],s:['KeyH']},
        {l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],b:['ArrowDown'],p:['Comma'],k:['Period'],s:['Slash']}];
var keys={},vk={},p2on=false;
function maps(i){return (!G.p2&&i===0)?[KM[0],KM[1]]:[KM[i]];}
function held(i,n){return maps(i).some(function(m){return m[n].some(function(c){return keys[c];});})||(i===0&&!!vk[n]);}
function readInput(f,i){var p=f.inp;p.l=held(i,'l')?1:0;p.r=held(i,'r')?1:0;p.u=held(i,'u')?1:0;p.blk=held(i,'b')?1:0;}
var gameEl=document.getElementById('game'),menuEl=document.getElementById('menu'),afterEl=document.getElementById('after'),pauseEl=document.getElementById('pause');
var afterFn=null;
function showAfter(label,fn){document.getElementById('aPri').textContent=label;afterFn=fn;afterEl.hidden=false;}
function hideAfter(){afterEl.hidden=true;afterFn=null;}
function setPause(v){if(gameEl.hidden||G.phase==='menu')return;G.paused=v;pauseEl.hidden=!v;if(v){keys={};vk={};}}
window.addEventListener('keydown',function(e){
  if(gameEl.hidden)return;
  if(e.code==='Escape'){setPause(!G.paused);return;}
  if(G.paused)return;
  var used=false;
  [0,1].forEach(function(i){
    var f=i?B:A;if(!f||!f.human)return;
    maps(i).forEach(function(m){
      ['p','k','s'].forEach(function(n){if(m[n].indexOf(e.code)>=0){used=true;if(!e.repeat)f.q[n]=.2;}});
      ['l','r','u','b'].forEach(function(n){if(m[n].indexOf(e.code)>=0)used=true;});
    });
  });
  if(used)e.preventDefault();
  if((e.code==='Enter'||e.code==='Space')&&!e.repeat){
    e.preventDefault();
    if(G.phase==='over'&&afterFn)afterFn();else advance();return;
  }
  if(!e.repeat&&(G.phase==='story'||G.phase==='replay'||G.phase==='victory')&&(e.code==='KeyF'||e.code==='KeyG'||e.code==='KeyH'))advance();
  keys[e.code]=true;
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
window.addEventListener('blur',function(){keys={};vk={};});
document.getElementById('cv').addEventListener('pointerdown',function(){advance();});
Array.prototype.forEach.call(document.querySelectorAll('#touch button'),function(b){
  var k=b.getAttribute('data-k'),tap=(k==='p'||k==='k'||k==='s');
  b.addEventListener('pointerdown',function(e){e.preventDefault();b.classList.add('on');
    if(G.phase==='story'||G.phase==='replay'||G.phase==='victory'){advance();return;}
    if(tap){if(A)A.q[k]=.2;}else vk[k]=true;});
  var up=function(){b.classList.remove('on');if(!tap)vk[k]=false;};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
document.getElementById('rot').addEventListener('pointerdown',function(){this.classList.add('gone');});

/* ---------- menu ---------- */
var tilesEl=document.getElementById('tiles'),previews=[];
try{var sv=+localStorage.getItem('sb_sel');if(sv>=0&&sv<6)sel=sv;}catch(e){}
CH.forEach(function(c,i){
  var b=document.createElement('button');b.type='button';b.className='tile';b.style.setProperty('--c',c.col);
  b.innerHTML='<canvas width="'+(120*dpr)+'" height="150"></canvas><span>'+c.name+'</span>';
  b.querySelector('canvas').height=150*dpr;b.setAttribute('aria-label',c.name);
  tilesEl.appendChild(b);
  previews.push({el:b,g:b.querySelector('canvas').getContext('2d'),f:null,i:i,w:120,h:150,gy:138});
  b.addEventListener('click',function(){sel=i;try{localStorage.setItem('sb_sel',String(i));}catch(e){}refreshTiles();});
});
function refreshTiles(){
  previews.forEach(function(p){var f=mk(p.i,-1,false,p.i===sel?look:null);f.x=60;f.face=1;p.f=f;p.el.setAttribute('aria-pressed',String(p.i===sel));});
}
function seg(id,items,get,set){
  var el=document.getElementById(id);
  items.forEach(function(it){var b=document.createElement('button');b.type='button';b.textContent=it[1];b.setAttribute('data-v',it[0]);el.appendChild(b);});
  function paint(){Array.prototype.forEach.call(el.children,function(b){b.setAttribute('aria-pressed',String(get()===b.getAttribute('data-v')));});}
  el.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;set(b.getAttribute('data-v'));paint();});paint();
}
function fillSel(id,first,list,cb){
  var el=document.getElementById(id);el.innerHTML='<option value="-1">'+first+'</option>'+list.map(function(n,i){return '<option value="'+i+'">'+n+'</option>';}).join('');
  el.addEventListener('change',function(){cb(+el.value);});
}
fillSel('oppSel','Random',CH.map(function(c){return c.name;}),function(v){oppSel=v;});
fillSel('stgSel','Random',LV.map(function(l){return l.n;}),function(v){stageSel=v;});
var hs=document.getElementById('hairSel');hs.innerHTML='<option value="">Default</option>'+HAIRS.map(function(h){return '<option value="'+h[0]+'">'+h[1]+'</option>';}).join('');
hs.addEventListener('change',function(){look.hair=hs.value||null;refreshTiles();});
seg('sP2',[['0','Off'],['1','On']],function(){return p2on?'1':'0';},function(v){p2on=v==='1';});
seg('sBlood',[['off','Off'],['on','Cartoon'],['absurd','Absurd']],function(){return bloodLevel;},function(v){bloodLevel=v;});
seg('sJig',[['off','Off'],['norm','Normal'],['absurd','Absurd']],function(){return jigLevel;},function(v){jigLevel=v;});
seg('sBody',[['','Default'],['F','Female'],['M','Male']],function(){return look.body||'';},function(v){look.body=v||null;refreshTiles();});
var optBtn=document.getElementById('bOpt'),optEl=document.getElementById('opts');
optBtn.addEventListener('click',function(){var o=optEl.hidden;optEl.hidden=!o;optBtn.setAttribute('aria-expanded',String(o));});
document.getElementById('bFight').addEventListener('click',function(){startGame('fight');});
document.getElementById('bStory').addEventListener('click',function(){startGame('story');});
function toMenu(){G.phase='menu';G.paused=false;pauseEl.hidden=true;hideAfter();gameEl.hidden=true;menuEl.hidden=false;document.documentElement.style.overflow='';refreshTiles();}
document.getElementById('bPause').addEventListener('click',function(){setPause(true);});
document.getElementById('pResume').addEventListener('click',function(){setPause(false);});
document.getElementById('pAgain').addEventListener('click',function(){setPause(false);if(G.mode==='story'){startGame('story');}else startGame('fight');});
document.getElementById('pMenu').addEventListener('click',toMenu);
document.getElementById('aPri').addEventListener('click',function(){if(afterFn)afterFn();});
document.getElementById('aMenu').addEventListener('click',toMenu);
refreshTiles();

/* ---------- loop ---------- */
function animPrev(p,now,dt){
  var f=p.f;if(!f)return;f.clock+=dt;f.x=p.w/2;f.y=p.gy-Math.abs(Math.sin(now/1000*3+p.i))*(p.i===sel?14:6);f.state=p.i===sel?'idle':'idle';
  poseUpdate(f,dt);f.sk=skel(f);jigStep(f,dt);
  var g=p.g;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,p.w,p.h);g.strokeStyle='#1d3a4d';g.lineWidth=1;ln(g,10,p.gy+1,p.w-10,p.gy+1);
  g.globalAlpha=p.i===sel?1:.55;drawF(g,f);g.globalAlpha=1;
}
var last=performance.now();
function frame(now){
  var rdt=Math.min(.033,(now-last)/1000);last=now;
  if(G.phase==='menu'){previews.forEach(function(p){animPrev(p,now,rdt);});}
  else{
    var ts=1;if(G.phase==='victory')ts=.3;else if(G.phase==='ko')ts=G.final?.4:.6;
    if(!G.paused)update(rdt*ts,rdt);
    render(now/1000);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
